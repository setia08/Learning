2 copies into a (32, 455) tensor, which is the bug your commit history fixed.","flow":[["Dataset","__len__, __getitem__"],["Sampler","shuffled indices"],["BatchSampler","groups of 32"],["collate","stack -> (32,30), (32,)"],["train step","per batch"],["epoch","15 steps"]],"mistakes":[{"title":"__getitem__ returning the whole label tensor","wrong":"def __getitem__(self, index):\n    return self.features[index], self.lables","right":"def __getitem__(self, index):\n    return self.features[index], self.lables[index]","why":"From your history (commit f53e4a6). Each batch's labels became (32, 455); after .view(-1,1) BCELoss raises ValueError: Using a target size (torch.Size([14560, 1])) that is different to the input size (torch.Size([32, 1]))."},{"title":"Averaging per-batch accuracies","wrong":"acc = sum(accuracy_list) / len(accuracy_list)","right":"correct += (pred == yb).sum().item()\ntotal += yb.size(0)\nacc = correct / total","why":"Batches have different sizes (the last test batch has 18 of 114). Counting correct samples is exact; your MNIST notebooks already do it this way."}],"practice":{"task":"Add a running epoch loss (average over all batches) instead of printing only the last batch's loss, set the test loader to shuffle=False, and compute exact accuracy with correct/total at threshold 0.5.","hint":"Accumulate loss.item() * batch size and divide by len(dataset) for an exact sample-weighted mean.","solution":"for epoch in range(epochs):\n    running = 0.0\n    for xb, yb in train_loader:\n        loss = loss_function(model(xb), yb.view(-1, 1))\n        optimizer.zero_grad(); loss.backward(); optimizer.step()\n        running += loss.item() * xb.size(0)\n    print(epoch + 1, running / len(train_dataset))\n\nmodel.eval(); correct = total = 0\nwith torch.no_grad():\n    for xb, yb in test_loader:\n        pred = (model(xb) > 0.5).float().view(-1)\n        correct += (pred == yb).sum().item(); total += yb.size(0)\nprint(correct / total)"},"quiz":[{"q":"455 training samples, batch_size=32. How many optimizer steps per epoch?","o":["14","15","32","455"],"a":1,"x":"ceil(455/32) = 15. The last batch has 7 samples (drop_last=False by default)."},{"q":"What does default collate do with 32 samples of shape (30,)?","o":["Returns a list of 32 tensors","Stacks them into a (32, 30) tensor","Concatenates into (960,)","Pads them"],"a":1,"x":"It stacks along a new first (batch) dimension."},{"q":"Why does the printed epoch loss jump around (0.17, 0.08, 0.22, 0.32)?","o":["The learning rate is unstable","Only the last mini-batch's loss is printed","Shuffling corrupts labels","eval() was not called"],"a":1,"x":"The print uses the loss from the final batch only, a small noisy sample. Averaging over all batches gives a smooth curve."}],"interview":[{"q":"Batch gradient descent vs mini-batch vs stochastic: trade-offs?","d":"Easy","t":"Optimisation fundamentals","a":"Full batch: exact gradient, one step per epoch, memory-hungry. Stochastic (batch 1): very noisy, many steps, poor hardware use. Mini-batch: a middle ground. Gradient noise helps escape sharp minima, steps are frequent, and the batch is big enough to use vectorised hardware. Batch size interacts with learning rate.","m":"Saying bigger batches are always better.","f":"If you double the batch size, what would you consider doing to the learning rate?"},{"q":"What's the difference between a map-style and an iterable-style Dataset?","d":"Medium","t":"Data pipeline design","a":"Map-style implements __getitem__ and __len__ for random access by index, which enables shuffling via samplers (all your notebooks). Iterable-style implements __iter__ and is used for streams or data too large to index (logs, web data). Shuffling and multi-worker sharding must then be handled manually.","m":"Not knowing iterable datasets exist.","f":"How do you avoid duplicate samples when an IterableDataset uses num_workers=4?"},{"q":"Why is shuffle=True on the training loader important?","d":"Easy","t":"SGD assumptions","a":"Mini-batch SGD assumes batches are random samples. If the data is ordered (all benign then all malignant), consecutive steps pull the weights in opposite directions and training oscillates or biases toward the last class seen. Shuffling each epoch also gives different batch compositions.","m":"Shuffling the test set 'for fairness', which has no effect on metrics.","f":"When would you not shuffle training data?"}],"cards":[["Two methods a map-style Dataset needs","__len__ (count) and __getitem__ (fetch one sample by index)."],["What does DataLoader's collate do?","Stacks a list of samples into batch tensors along a new dim 0."],["Should the test loader shuffle?","No need; order doesn't change metrics. shuffle=False is the convention."],["Exact accuracy over batches","Sum correct predictions and divide by total samples, not the mean of batch accuracies."]],"summary":"Dataset = __len__ + __getitem__ returning one sample (index the labels too!). DataLoader shuffles, batches and collates into (B, ...) tensors. Mini-batches mean many updates per epoch. Report the average loss across batches, evaluate with model.eval() + no_grad, threshold at 0.5, flatten before comparing, and count correct/total.","code":"from torch.utils.data import Dataset,DataLoader\nclass CustomDataset(Dataset):\n  def __init__(self,features,lables):\n    self.features=features\n    self.lables=lables\n\n  def __len__(self):\n    return self.features.shape[0]\n\n  def __getitem__(self,index):\n    return self.features[index],self.lables[index]\n\ntrain_dataset=CustomDataset(X_train_tensor,y_train_tensor)\ntest_dataset=CustomDataset(X_test_tensor,y_test_tensor)\n\ntrain_loader=DataLoader(train_dataset,batch_size=32,shuffle=True)\ntest_loader=DataLoader(test_dataset,batch_size=32,shuffle=True)\n\n# create model\nmodel = MySimpleNN(X_train_tensor.shape[1])\n\n# define optimizer\noptimizer = torch.optim.SGD(model.parameters(), lr=learning_rate)\n\n# define loop\n\n# define loop\nfor epoch in range(epochs):\n\n  for batch_features, batch_labels in train_loader:\n\n    # forward pass\n    y_pred = model(batch_features)\n\n    # loss calculate\n    loss = loss_function(y_pred, batch_labels.view(-1,1))\n\n    # clear gradients\n    optimizer.zero_grad()\n\n    # backward pass\n    loss.backward()\n\n    # parameters update\n    optimizer.step()\n\n  # print loss in each epoch\n  print(f'Epoch: {epoch + 1}, Loss: {loss.item()}')\n\n# Model evaluation using test_loader\nmodel.eval()  # Set the model to evaluation mode\naccuracy_list = []\n\nwith torch.no_grad():\n    for batch_features, batch_labels in test_loader:\n        # Forward pass\n        y_pred = model(batch_features)\n        y_pred = (y_pred > 0.8).float()  # Convert probabilities to binary predictions\n\n        # Calculate accuracy for the current batch\n        batch_accuracy = (y_pred.view(-1) == batch_labels).float().mean().item()\n        accuracy_list.append(batch_accuracy)\n\n# Calculate overall accuracy\noverall_accuracy = sum(accuracy_list) / len(accuracy_list)\nprint(f'Accuracy: {overall_accuracy:.4f}')","code_src":"Full_pytorch_training_pipeline_using_nn_module.ipynb","code_cells":"17, 18, 19, 28, 30","short":"DataLoader","sub":"mini-batches"},{"id":"ann","title":"ANN on MNIST","nb":"ANN_using_Pytorch.ipynb","concept":"Multi-class classification of 28x28 digits with a 784-128-64-10 MLP, nn.Sequential, CrossEntropyLoss","apis":["nn.Sequential","nn.ReLU","nn.CrossEntropyLoss","torch.long labels","optim.SGD","torch.max(outputs, 1)","model.eval()","total_epoch_loss / len(loader)"],"what":"Your first multi-class network. Each 28x28 image is flattened to 784 pixel values scaled to [0,1], passed through two ReLU hidden layers (128, 64) and a final Linear producing 10 scores, one per digit. Trained for 25 epochs with SGD, it reaches 94.6% test accuracy.","why":"This moves from 'one probability' (binary) to 'pick one of 10' (multi-class), which changes the output layer, the loss and the label dtype. It also introduces `nn.Sequential` and proper per-epoch average loss, the template reused by the Dropout, Optuna and VGG16 notebooks.","mental":"The network outputs 10 raw scores (logits), like 10 judges each shouting a number. CrossEntropyLoss turns the shouts into probabilities with softmax and penalises how little probability went to the right digit. At test time you just pick the loudest judge (`torch.max(outputs, 1)`).","syntax":"model = nn.Sequential(\n    nn.Linear(784, 128), nn.ReLU(),\n    nn.Linear(128, 64),  nn.ReLU(),\n    nn.Linear(64, 10),                 # raw logits, no softmax\n)\ncriterion = nn.CrossEntropyLoss()      # expects logits + long class ids\nloss = criterion(outputs, labels)      # outputs (B,10), labels (B,)\n_, predicted = torch.max(outputs, 1)   # class with highest logit","lines":[["X_train=X_train/255.0","Pixel values 0-255 become 0-1, keeping activations and gradients in a healthy range."],["self.labels=torch.tensor(labels,dtype=torch.long)","CrossEntropyLoss wants integer class indices (int64), not floats or one-hot vectors."],["train_load=DataLoader(train_dataset,batch_size=32,shuffle=True)","16,000 images / 32 = 500 steps per epoch."],["self.model=nn.Sequential(","Sequential runs its layers in order, so forward is just return self.model(x)."],["nn.Linear(64,10)","10 outputs = 10 classes. No softmax: CrossEntropyLoss applies log-softmax itself."],["criterion=nn.CrossEntropyLoss()","LogSoftmax + NLLLoss fused, numerically stable."],["total_epoch_loss=total_epoch_loss+loss.item()",".item() turns the loss into a Python float, detaching it so graphs aren't kept alive."],["avg_loss=total_epoch_loss/len(train_load)","Average over batches: the smooth curve from 2.11 down to 0.167."],["model.eval()","Good habit; no Dropout/BatchNorm yet, so it changes nothing here."],["_,predicted=torch.max(outputs,1)","max along dim 1 returns (values, indices); the index is the predicted digit."]],"internals":"CrossEntropyLoss computes log_softmax(logits) and then picks the entry at each sample's label: loss = -logit[y] + log(sum(exp(logits))). log-sum-exp subtracts the max logit first, so exp never overflows. The gradient with respect to the logits is softmax(logits) - one_hot(y), which is the multi-class version of the y_pred - y you derived in the autograd notebook. ReLU's gradient is 1 for positive inputs and 0 otherwise, so the signal passes through hidden layers without shrinking the way sigmoid's does.","flow":[["image 28x28","flatten to 784, /255"],["Linear 784->128 + ReLU","hidden 1"],["Linear 128->64 + ReLU","hidden 2"],["Linear 64->10","logits"],["CrossEntropyLoss","log-softmax + NLL"],["argmax","predicted digit"]],"mistakes":[{"title":"Adding Softmax before CrossEntropyLoss","wrong":"nn.Linear(64, 10),\nnn.Softmax(dim=1)     # then CrossEntropyLoss","right":"nn.Linear(64, 10)     # raw logits into CrossEntropyLoss","why":"CrossEntropyLoss already applies log-softmax. Softmax twice flattens the distribution and slows learning a lot, without any error."},{"title":"Float labels for CrossEntropyLoss","wrong":"labels = torch.tensor(y, dtype=torch.float32)\ncriterion(outputs, labels)","right":"labels = torch.tensor(y, dtype=torch.long)\ncriterion(outputs, labels)","why":"With (B,) float targets you get an error expecting Long; float targets are only for class-probability targets of shape (B, C)."}],"practice":{"task":"Add a per-class accuracy report: for each digit 0-9, how many test images were classified correctly out of how many there were. Which digit is hardest?","hint":"Use a length-10 list for correct and total and index it with batch_labels.","solution":"correct = [0]*10; total = [0]*10\nmodel.eval()\nwith torch.no_grad():\n    for xb, yb in test_loader:\n        pred = model(xb).argmax(1)\n        for t, p in zip(yb.tolist(), pred.tolist()):\n            total[t] += 1; correct[t] += int(t == p)\nfor d in range(10):\n    print(d, correct[d] / total[d])"},"quiz":[{"q":"What should the last layer output for 10-class classification with CrossEntropyLoss?","o":["10 probabilities from Softmax","10 raw logits","One number between 0 and 9","A one-hot vector"],"a":1,"x":"CrossEntropyLoss applies log-softmax internally, so it wants raw scores."},{"q":"What dtype and shape should labels have for CrossEntropyLoss here?","o":["float32, (B, 10)","long, (B,)","long, (B, 1)","float32, (B,)"],"a":1,"x":"Class indices as int64 with one entry per sample."},{"q":"What does torch.max(outputs, 1) return?","o":["The largest value only","A (values, indices) tuple along dim 1","The probabilities","The loss"],"a":1,"x":"The notebook keeps the indices: _, predicted = torch.max(outputs, 1)."}],"interview":[{"q":"Why does CrossEntropyLoss take logits rather than probabilities?","d":"Medium","t":"Numerical stability and API design","a":"Fusing log-softmax with the loss lets PyTorch use the log-sum-exp trick, avoiding overflow in exp and log(0) underflow. Taking log of an already-computed softmax loses precision for tiny probabilities. The gradient also simplifies to softmax - one_hot.","m":"Saying probabilities are needed because loss is defined on probabilities, and adding a Softmax layer.","f":"How would you get calibrated probabilities at inference time?"},{"q":"Why does ReLU train deeper networks better than sigmoid?","d":"Easy","t":"Vanishing gradients","a":"ReLU's derivative is exactly 1 for positive inputs, so gradients aren't repeatedly scaled down by factors at most 0.25 as with sigmoid. It's cheap to compute and produces sparse activations.","m":"Ignoring dying ReLU, where units stuck at negative inputs output 0 forever.","f":"What does LeakyReLU change?"},{"q":"This MLP flattens images. What does that throw away, and what would you use instead?","d":"Medium","t":"Inductive bias","a":"Flattening discards spatial structure: the model doesn't know pixel 0 is next to pixel 1, and it has to learn the same edge detector separately at every position (784x128 weights in layer 1). A CNN uses local, weight-shared filters, giving translation equivariance with far fewer parameters.","m":"Saying MLPs can't do images at all; they get about 97-98% on MNIST.","f":"How many parameters does nn.Conv2d(1, 32, 3) have vs your first Linear layer?"}],"cards":[["Last layer + loss for multi-class","Linear(..., num_classes) producing logits, then nn.CrossEntropyLoss."],["Label format for CrossEntropyLoss","torch.long class indices with shape (B,)."],["Why divide pixels by 255?","Scales inputs to [0,1] so activations and gradients stay well-behaved."],["Gradient of CE w.r.t. logits","softmax(logits) - one_hot(label)."]],"summary":"Multi-class = Linear to num_classes logits + CrossEntropyLoss (no Softmax layer) + long labels. nn.Sequential chains layers. Scale pixels to [0,1]. Average loss across batches with .item(). Predict with argmax over dim 1. Count correct/total. 94.6% on MNIST with a 784-128-64-10 ReLU MLP.","code":"X_train=X_train/255.0\nX_test=X_test/255.0\n\nclass CustomDataset(Dataset):\n  def __init__(self,features,labels):\n    self.features=torch.tensor(features,dtype=torch.float32)\n    self.labels=torch.tensor(labels,dtype=torch.long)\n\n  def __len__(self):\n      return len(self.features)\n  def __getitem__(self, index):\n      return self.features[index], self.labels[index]\n\ntrain_load=DataLoader(train_dataset,batch_size=32,shuffle=True)\n\nclass MyNN(nn.Module):\n  def __init__(self,num_features):\n    super().__init__()\n    self.model=nn.Sequential(\n        nn.Linear(num_features,128),\n        nn.ReLU(),\n        nn.Linear(128,64),\n        nn.ReLU(),\n        nn.Linear(64,10)\n    )\n  def forward(self,x):\n    return self.model(x)\n\nmodel=MyNN(X_train.shape[1])\ncriterion=nn.CrossEntropyLoss()\noptimizer=optim.SGD(model.parameters(),lr=learning_rate)\n\nfor epoch in range(epochs):\n  total_epoch_loss=0\n  for batch_features,batch_labels in train_load:\n    outputs=model(batch_features)\n    loss=criterion(outputs,batch_labels)\n    optimizer.zero_grad()\n    loss.backward()\n    optimizer.step()\n    total_epoch_loss=total_epoch_loss+loss.item()\n  avg_loss=total_epoch_loss/len(train_load)\n  print(f'Epoch: {epoch+1}, Loss: {avg_loss}')\n\nmodel.eval()\n\ntotal=0\ncorrect=0\n\nwith torch.no_grad():\n  for batch_features,batch_labels in test_loader:\n    outputs=model(batch_features)\n    _,predicted=torch.max(outputs,1)\n    total=total+batch_labels.shape[0]\n    correct=correct+(predicted== batch_labels).sum().item()\nprint(correct/total)","code_src":"ANN_using_Pytorch.ipynb","code_cells":"6, 7, 10, 12, 14, 15, 16, 17","short":"MNIST ANN","sub":"CrossEntropyLoss"},{"id":"regularization","title":"Dropout, BatchNorm and GPU","nb":"ANN_using_Pytorch_with_Dropout_and_others.ipynb","concept":"Regularisation (Dropout, weight decay), normalisation (BatchNorm1d), train vs eval mode, device-agnostic training","apis":["nn.BatchNorm1d","nn.Dropout(p)","weight_decay=","model.to(device)","batch.to(device)","pin_memory=True","model.eval()","model.train()"],"what":"The MNIST MLP with three upgrades: `BatchNorm1d` after each hidden Linear, `Dropout(p=0.3)` after each ReLU, and L2 `weight_decay=1e-4` on SGD. It also becomes device-agnostic: the model and every batch go to `device`. Test accuracy goes from 94.6% to 96.75%.","why":"Bigger networks memorise training data. Dropout and weight decay make memorising harder, BatchNorm makes optimisation smoother and adds mild regularisation, and the GPU makes training fast enough to experiment. Because Dropout and BatchNorm behave differently in training and inference, this is the first notebook where `model.eval()` actually changes the output.","mental":"Dropout is a team where random members call in sick each practice, so nobody can rely on one star player; on match day (eval) everyone shows up. BatchNorm is a referee who re-centres each layer's inputs to mean 0, std 1 every batch so the next layer always sees a consistent scale, and at test time uses long-run averages instead of the current batch. Weight decay is a small tax on large weights.","syntax":"device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\nnn.Sequential(\n    nn.Linear(784, 128), nn.BatchNorm1d(128), nn.ReLU(), nn.Dropout(0.3),\n    ...\n)\nmodel = model.to(device)\noptimizer = optim.SGD(model.parameters(), lr=0.01, weight_decay=1e-4)\nmodel.train()                       # dropout on, BN uses batch stats\nxb, yb = xb.to(device), yb.to(device)\nmodel.eval()                        # dropout off, BN uses running stats","lines":[["device=torch.device('cuda' if torch.cuda.is_available() else \"cpu\")","Device-agnostic: same code on Colab GPU or a laptop."],["train_load=DataLoader(train_dataset,batch_size=32,shuffle=True,pin_memory=True)","Page-locked memory for faster host-to-GPU copies. Your Mac run warns it's unsupported on MPS."],["nn.BatchNorm1d(128),","Normalises each of 128 features over the batch, then applies learnable scale and shift."],["nn.Dropout(p=0.3),","In training, zeroes 30% of activations at random and scales the rest by 1/0.7."],["model=model.to(device)","Moves all parameters and BatchNorm buffers (running mean/var) to the device."],["optimizer=optim.SGD(model.parameters(),lr=learning_rate,weight_decay=1e-4)","Adds 1e-4 * w to each gradient: L2 regularisation."],["batch_features = batch_features.to(device)","Every batch must follow the model to the device."],["model.eval()","Now matters: Dropout turns off and BatchNorm switches to running statistics."]],"internals":"Dropout in training multiplies activations by a Bernoulli(1-p) mask divided by (1-p) (inverted dropout), so expected values match and eval needs no rescaling. BatchNorm1d in training normalises with the batch mean/variance and updates `running_mean`/`running_var` with momentum 0.1; in eval it uses those running buffers. Those buffers are registered with `register_buffer`, so `.to(device)` moves them and `state_dict` saves them, but the optimizer doesn't train them. `model.train()`/`model.eval()` just flip a `training` flag on every submodule recursively.","flow":[["batch .to(device)","pinned copy"],["Linear","784 -> 128"],["BatchNorm1d","normalise per feature"],["ReLU + Dropout","30% zeroed in train"],["... -> Linear 64->10","logits"],["eval()","no dropout, running stats"]],"mistakes":[{"title":"Evaluating with dropout still active","wrong":"# after training, straight into evaluation\nwith torch.no_grad():\n    outputs = model(xb)","right":"model.eval()\nwith torch.no_grad():\n    outputs = model(xb)\nmodel.train()   # before training again","why":"This notebook calls model.eval() correctly. The VGG16 notebook doesn't, so its Dropout(0.5) layers stay on at test time."},{"title":"Moving the model but not the batch","wrong":"model = model.to(device)\noutputs = model(batch_features)   # still on CPU","right":"batch_features = batch_features.to(device)\nbatch_labels = batch_labels.to(device)\noutputs = model(batch_features)","why":"Produces 'Expected all tensors to be on the same device'. Every input and target must be moved."}],"practice":{"task":"Train the same architecture twice, once with Dropout p=0.0 and once with p=0.3, and print train vs test accuracy for both. Is the train-test gap smaller with dropout?","hint":"Compute train accuracy with model.eval() too, otherwise dropout lowers it artificially.","solution":"def accuracy(model, loader):\n    model.eval(); c = t = 0\n    with torch.no_grad():\n        for xb, yb in loader:\n            xb, yb = xb.to(device), yb.to(device)\n            c += (model(xb).argmax(1) == yb).sum().item(); t += yb.size(0)\n    model.train(); return c / t\n# build MyNN with p as a constructor arg, train each, then:\nprint(accuracy(m, train_load), accuracy(m, test_loader))"},"quiz":[{"q":"With Dropout(p=0.3) in training, surviving activations are multiplied by?","o":["0.3","0.7","1/0.7","1"],"a":2,"x":"Inverted dropout rescales by 1/(1-p) so the expected activation is unchanged and eval needs no correction."},{"q":"What does BatchNorm1d use at evaluation time?","o":["The current batch's mean and variance","Running averages collected during training","Zero mean, unit variance always","Nothing; it's disabled"],"a":1,"x":"model.eval() switches it to the running_mean/running_var buffers."},{"q":"What does weight_decay=1e-4 add to each parameter's gradient in SGD?","o":["1e-4","1e-4 * w","1e-4 * grad","-1e-4"],"a":1,"x":"That's the gradient of 0.5 * 1e-4 * ||w||^2, the L2 penalty."}],"interview":[{"q":"Why does BatchNorm behave differently at train and test time?","d":"Medium","t":"Train/eval mode semantics","a":"In training it normalises using the current batch statistics, which adds noise and depends on batch composition. At inference you may have batch size 1 and want deterministic outputs, so it uses running averages accumulated during training. Forgetting model.eval() gives batch-dependent, noisier predictions.","m":"Saying BatchNorm is turned off in eval mode.","f":"What happens with BatchNorm1d if your last training batch has exactly 1 sample?"},{"q":"Is weight_decay in Adam the same as L2 regularisation?","d":"Hard","t":"Optimiser details","a":"For SGD they're equivalent. In Adam, adding wd * w to the gradient means it gets divided by the adaptive denominator, so heavily-updated weights are decayed less. AdamW decouples decay and applies w -= lr * wd * w directly, which usually generalises better.","m":"Assuming weight_decay means the same thing in every optimiser.","f":"Your Optuna search used Adam with weight_decay. Would you switch to AdamW?"},{"q":"Dropout vs BatchNorm vs weight decay: how do they regularise differently?","d":"Medium","t":"Regularisation concepts","a":"Dropout injects multiplicative noise into activations, preventing co-adaptation (an implicit ensemble). Weight decay penalises weight magnitude, favouring simpler functions. BatchNorm mainly helps optimisation (smoother loss, higher usable learning rates); its regularising effect is a side effect of batch-statistic noise.","m":"Calling BatchNorm primarily a regulariser.","f":"Why do some architectures put Dropout before BatchNorm and others after, and does it matter?"}],"cards":[["What does model.eval() change?","Dropout stops dropping; BatchNorm uses running statistics instead of batch statistics."],["Inverted dropout scaling","Training activations are scaled by 1/(1-p) so eval needs no change."],["weight_decay in SGD equals","L2 regularisation: adds wd * w to every gradient."],["What must move to device in a training loop?","The model once, and every batch of inputs and labels."]],"summary":"BatchNorm1d normalises per feature using batch stats in train and running stats in eval. Dropout zeros p of activations in train only. weight_decay adds L2. Call model.eval() before evaluating and model.train() before training. Move the model and every batch to one device. 94.6% to 96.75% on MNIST.","code":"device=torch.device('cuda' if torch.cuda.is_available() else \"cpu\")\ntrain_load=DataLoader(train_dataset,batch_size=32,shuffle=True,pin_memory=True)\n\nclass MyNN(nn.Module):\n  def __init__(self,num_features):\n    super().__init__()\n    self.model=nn.Sequential(\n        nn.Linear(num_features,128),\n        nn.BatchNorm1d(128),\n        nn.ReLU(),\n        nn.Dropout(p=0.3),\n        nn.Linear(128,64),\n        nn.BatchNorm1d(64),\n        nn.ReLU(),\n        nn.Dropout(p=0.3),\n        nn.Linear(64,10),\n    )\n  def forward(self,x):\n    return self.model(x)\n\nmodel=MyNN(X_train.shape[1])\nmodel=model.to(device)\ncriterion=nn.CrossEntropyLoss()\noptimizer=optim.SGD(model.parameters(),lr=learning_rate,weight_decay=1e-4)\n\nfor epoch in range(epochs):\n  total_epoch_loss=0\n  for batch_features,batch_labels in train_load:\n    batch_features = batch_features.to(device)\n    batch_labels = batch_labels.to(device)\n    outputs=model(batch_features)\n    loss=criterion(outputs,batch_labels)\n    optimizer.zero_grad()\n    loss.backward()\n    optimizer.step()\n    total_epoch_loss=total_epoch_loss+loss.item()\n  avg_loss=total_epoch_loss/len(train_load)\n  print(f'Epoch: {epoch+1}, Loss: {avg_loss}')\n\nmodel.eval()","code_src":"ANN_using_Pytorch_with_Dropout_and_others.ipynb","code_cells":"1, 11, 13, 15, 16, 17","short":"Dropout and BN","sub":"eval(), weight decay"},{"id":"optuna","title":"Hyperparameter tuning with Optuna","nb":"ANN_using_Pytorch_with_Optuna.ipynb","concept":"Building a configurable network from a list of layers and searching architecture + training hyperparameters","apis":["nn.Sequential(*layers)","trial.suggest_int","trial.suggest_float(log=True)","trial.suggest_categorical","optim.Adam","optim.RMSprop","optuna.create_study","study.optimize","study.best_params"],"what":"An `objective(trial)` function that asks Optuna for 8 hyperparameters (layers 1-5, width 8-128, epochs, learning rate, dropout, batch size, optimizer, weight decay), builds a matching `MyNN`, trains it and returns test accuracy. Optuna runs 3 trials and keeps the best: 2 layers of 104 units with SGD, 97.3%.","why":"Learning rate, depth and regularisation strength have huge effects and no closed-form best value. Grid search is wasteful and manual tuning is slow; Optuna's default TPE sampler learns from earlier trials which regions look promising. The pattern of building layers in a loop also shows how to make architectures configurable.","mental":"Optuna is a chef running taste tests. Each trial is one recipe: the chef proposes amounts (`suggest_*`), you cook it (train) and report a score (return accuracy). After a few tastings the chef stops trying obviously bad combinations and explores near the good ones.","syntax":"def objective(trial):\n    lr = trial.suggest_float('learning_rate', 1e-5, 1e-1, log=True)\n    n_layers = trial.suggest_int('num_hidden_layers', 1, 5)\n    opt_name = trial.suggest_categorical('optimizer', ['Adam', 'SGD'])\n    model = build_model(n_layers, ...)\n    optimizer = getattr(optim, opt_name)(model.parameters(), lr=lr)\n    train(model, optimizer)\n    return evaluate(model, val_loader)       # a VALIDATION score\n\nstudy = optuna.create_study(direction='maximize')\nstudy.optimize(objective, n_trials=50)\nstudy.best_params","lines":[["layers = []","Start with an empty Python list of layers."],["layers.append(nn.Linear(input_dim, neurons_per_layer))","Each loop iteration adds one hidden block: Linear, BatchNorm, ReLU, Dropout."],["input_dim = neurons_per_layer","The next layer's input size is this layer's output size."],["self.model = nn.Sequential(*layers)","Unpacks the list into Sequential so every layer is registered as a submodule."],["learning_rate = trial.suggest_float(\"learning_rate\", 1e-5, 1e-1, log=True)","log=True samples evenly across orders of magnitude, which is the right scale for learning rates."],["batch_size = trial.suggest_categorical(\"batch_size\", [16, 32, 64, 128])","DataLoaders are rebuilt inside the objective because batch size is a hyperparameter."],["optimizer = optim.Adam(model.parameters(), lr=learning_rate, weight_decay=weight_decay)","Assigned to optimizer, which the training loop uses. Commit 4736191 fixed a version where this was built but never assigned."],["return accuracy","The value Optuna maximises. It's computed on test_loader, so the test set is being used for model selection."],["study=optuna.create_study(direction=\"maximize\")","maximize because higher accuracy is better (minimize for losses)."],["study.optimize(objective,n_trials=3)","3 trials is a smoke test; TPE needs roughly 20+ to beat random search."]],"internals":"Optuna's default sampler, TPE, splits completed trials into good and bad groups by score, fits a density model to each group's hyperparameter values, and proposes new values where the good/bad density ratio is highest. Each `suggest_*` call records the parameter and its distribution in the trial. `nn.Sequential(*layers)` registers each list element as a child module under names '0', '1', ..., which a plain Python list stored as an attribute would not.","flow":[["study.optimize","n trials"],["trial.suggest_*","sample 8 hyperparameters"],["build MyNN","layers list -> Sequential"],["train","chosen optimizer"],["evaluate","return score"],["TPE update","pick next trial"]],"mistakes":[{"title":"Building the optimizer but never using it","wrong":"optimizer = optim.SGD(model.parameters(), lr=0.1)\nif optimizer_name == 'Adam':\n    optim.Adam(model.parameters(), lr=learning_rate)\n# training uses the SGD above every time","right":"if optimizer_name == 'Adam':\n    optimizer = optim.Adam(model.parameters(), lr=learning_rate,\n                           weight_decay=weight_decay)","why":"From your history (commit 4736191). Every trial silently trained with the same hard-coded SGD, so the 'optimizer' and weight-decay search did nothing."},{"title":"Tuning on the test set","wrong":"return accuracy   # computed on test_loader","right":"# split train into train/val once, tune on val\nreturn evaluate(model, val_loader)\n# touch test_loader once, after picking best_params","why":"Choosing hyperparameters by test accuracy makes the reported 97.3% optimistically biased. The test set should only be used once, at the end."}],"practice":{"task":"Carve a validation set out of the training data, make objective() return validation accuracy, run 20 trials, then retrain with study.best_params and report test accuracy once.","hint":"train_test_split(X_train, y_train, test_size=0.1, random_state=42) gives you a validation split.","solution":"X_tr, X_val, y_tr, y_val = train_test_split(X_train, y_train, test_size=0.1, random_state=42)\ntrain_dataset = CustomDataset(X_tr, y_tr)\nval_dataset = CustomDataset(X_val, y_val)\n# in objective: evaluate on DataLoader(val_dataset, ...)\nstudy.optimize(objective, n_trials=20)\nbest = study.best_params\n# rebuild with best, train on X_train, evaluate once on test_loader"},"quiz":[{"q":"Why use suggest_float(..., log=True) for the learning rate?","o":["It's required for floats","So values are sampled evenly across orders of magnitude","To make the search deterministic","To restrict values to integers"],"a":1,"x":"1e-5 to 1e-1 spans 4 orders of magnitude; linear sampling would almost never try small rates."},{"q":"Why nn.Sequential(*layers) instead of self.layers = layers?","o":["Sequential is faster","A plain list doesn't register the layers, so parameters() would miss them","Lists can't hold modules","No difference"],"a":1,"x":"Only Module attributes (or ModuleList/Sequential) get registered. A plain list would leave the optimizer with no parameters."},{"q":"What's wrong with returning test accuracy from objective()?","o":["Optuna can't maximise accuracy","The test set gets used for model selection, so final test accuracy is biased","It's too slow","Accuracy isn't a float"],"a":1,"x":"Use a separate validation set for tuning and keep test for a single final evaluation."}],"interview":[{"q":"Grid search vs random search vs Bayesian (TPE) optimisation?","d":"Medium","t":"Hyperparameter search strategy","a":"Grid search tries every combination, which explodes with dimensions and wastes trials on unimportant parameters. Random search covers each important dimension better for the same budget. TPE/Bayesian methods use past results to focus on promising regions, typically finding good configurations in fewer trials. Pruning (stopping bad trials early) adds more savings.","m":"Assuming grid search is the most thorough and therefore best.","f":"How would you add pruning to this objective with trial.report and trial.should_prune?"},{"q":"Your Optuna fix commit says the optimizer search 'silently' did nothing. How would you have caught it?","d":"Medium","t":"Experiment hygiene","a":"Log the actual optimizer class (type(optimizer).__name__) and hyperparameters inside each trial; check that changing a searched parameter changes results; look at Optuna's param importance plot (an important-looking parameter with zero effect is suspicious); and write a unit test that the built optimizer matches the suggested name.","m":"Trusting best_params without verifying they were used.","f":"What's another way a hyperparameter can be 'searched' but have no effect?"},{"q":"Which hyperparameters would you tune first for an MLP and why?","d":"Easy","t":"Practical prioritisation","a":"Learning rate first (largest effect, on a log scale), then batch size and optimiser, then capacity (width/depth) and regularisation (dropout, weight decay) together because they trade off, then epochs, often replaced by early stopping.","m":"Tuning epochs as a hyperparameter instead of using early stopping on validation loss.","f":"Why do learning rate and batch size interact?"}],"cards":[["trial.suggest_float(..., log=True) is for","Parameters spanning orders of magnitude, like learning rate or weight decay."],["How to build a variable-depth network","Append layers to a list in a loop, then nn.Sequential(*layers)."],["What should objective() return?","A validation metric, never the test metric."],["direction='maximize' vs 'minimize'","Maximize accuracy-like scores; minimize losses."]],"summary":"objective(trial) samples hyperparameters with suggest_int/float/categorical, builds a model (list of layers then Sequential(*layers)), trains and returns a score. create_study(direction=...) + optimize(n_trials). Log-scale for learning rates. Make sure the chosen optimizer is actually assigned. Tune on validation, report on test once.","code":"class MyNN(nn.Module):\n\n  def __init__(self, input_dim, output_dim, num_hidden_layers, neurons_per_layer, dropout_rate):\n\n    super().__init__()\n\n    layers = []\n\n    for i in range(num_hidden_layers):\n\n      layers.append(nn.Linear(input_dim, neurons_per_layer))\n      layers.append(nn.BatchNorm1d(neurons_per_layer))\n      layers.append(nn.ReLU())\n      layers.append(nn.Dropout(dropout_rate))\n      input_dim = neurons_per_layer\n\n    layers.append(nn.Linear(neurons_per_layer, output_dim))\n\n    self.model = nn.Sequential(*layers)\n\n  def forward(self, x):\n\n    return self.model(x)\n\n# objective function\ndef objective(trial):\n\n  # next hyperparameter values from the search space\n  num_hidden_layers = trial.suggest_int(\"num_hidden_layers\", 1, 5)\n  neurons_per_layer = trial.suggest_int(\"neurons_per_layer\", 8, 128, step=8)\n  epochs = trial.suggest_int(\"epochs\", 10, 50, step=10)\n  learning_rate = trial.suggest_float(\"learning_rate\", 1e-5, 1e-1, log=True)\n  dropout_rate = trial.suggest_float(\"dropout_rate\", 0.1, 0.5, step=0.1)\n  batch_size = trial.suggest_categorical(\"batch_size\", [16, 32, 64, 128])\n  optimizer_name = trial.suggest_categorical(\"optimizer\", ['Adam', 'SGD', 'RMSprop'])\n  weight_decay = trial.suggest_float(\"weight_decay\", 1e-5, 1e-3, log=True)\n\n  train_loader = DataLoader(train_dataset, batch_size=batch_size, shuffle=True, pin_memory=True)\n  test_loader = DataLoader(test_dataset, batch_size=batch_size, shuffle=False, pin_memory=True)\n\n  # model init\n  input_dim = 784\n  output_dim = 10\n\n  model = MyNN(input_dim, output_dim, num_hidden_layers, neurons_per_layer, dropout_rate)\n  model.to(device)\n\n  # optimizer selection\n  criterion = nn.CrossEntropyLoss()\n\n  if optimizer_name == 'Adam':\n    optimizer = optim.Adam(model.parameters(), lr=learning_rate, weight_decay=weight_decay)\n  elif optimizer_name == 'SGD':\n    optimizer = optim.SGD(model.parameters(), lr=learning_rate, weight_decay=weight_decay)\n  else:\n    optimizer = optim.RMSprop(model.parameters(), lr=learning_rate, weight_decay=weight_decay)\n\n  # training loop\n\n  for epoch in range(epochs):\n\n    for batch_features, batch_labels in train_loader:\n\n      # move data to gpu\n      batch_features, batch_labels = batch_features.to(device), batch_labels.to(device)\n\n      # forward pass\n      outputs = model(batch_features)\n\n      # calculate loss\n      loss = criterion(outputs, batch_labels)\n\n      # back pass\n      optimizer.zero_grad()\n      loss.backward()\n\n      # update grads\n      optimizer.step()\n\n\n  # evaluation\n  model.eval()\n  # evaluation on test data\n  total = 0\n  correct = 0\n\n  with torch.no_grad():\n\n    for batch_features, batch_labels in test_loader:\n\n      # move data to gpu\n      batch_features, batch_labels = batch_features.to(device), batch_labels.to(device)\n\n      outputs = model(batch_features)\n\n      _, predicted = torch.max(outputs, 1)\n\n      total = total + batch_labels.shape[0]\n\n      correct = correct + (predicted == batch_labels).sum().item()\n\n    accuracy = correct/total\n\n  return accuracy\n\nimport optuna\n\nstudy=optuna.create_study(direction=\"maximize\")\nstudy.optimize(objective,n_trials=3)","code_src":"ANN_using_Pytorch_with_Optuna.ipynb","code_cells":"13, 14, 15, 18","short":"Optuna","sub":"hyperparameter search"},{"id":"transfer","title":"Transfer learning (VGG16)","nb":"transfer_learning_fashion_mnist_pytorch_gpu (1).ipynb","concept":"Reusing a pretrained ImageNet CNN: matching its input format, freezing the conv base, replacing the classifier head","apis":["torchvision.transforms.Compose","Resize","CenterCrop","ToTensor","Normalize","PIL.Image.fromarray","models.vgg16(pretrained=True)","param.requires_grad = False","vgg16.classifier = nn.Sequential(...)","optim.Adam(vgg16.classifier.parameters())"],"what":"Instead of training from scratch, the notebook downloads VGG16 (138M parameters trained on ImageNet), freezes its 13 convolutional layers, and swaps the final classifier for a new 25088 -> 1024 -> 512 -> 10 head trained on MNIST digits. Each 28x28 grayscale digit is converted to a 3-channel 224x224 image normalised with ImageNet statistics so it looks like what VGG16 was trained on.","why":"Training a deep CNN from scratch needs lots of data and GPU time. The early conv layers of a pretrained net already detect general features (edges, textures, shapes) that transfer to new tasks. Freezing them and training only a small head gives strong results quickly, even with modest data. This is also the only notebook that uses convolutions at all.","mental":"Hiring an experienced photographer and only teaching them your company's filing system. Their eye (conv features) is already trained; you don't retrain it, you just add a new final step that maps what they see to your 10 labels. But you must hand them photos in the format they're used to: 3 colour channels, 224x224, ImageNet colour statistics.","syntax":"from torchvision import models, transforms\ntf = transforms.Compose([\n    transforms.Resize(256), transforms.CenterCrop(224), transforms.ToTensor(),\n    transforms.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),\n])\nmodel = models.vgg16(weights=models.VGG16_Weights.DEFAULT)\nfor p in model.features.parameters():\n    p.requires_grad = False                     # freeze conv base\nmodel.classifier = nn.Sequential(nn.Linear(25088, 1024), nn.ReLU(), ..., nn.Linear(512, 10))\noptimizer = optim.Adam(model.classifier.parameters(), lr=1e-4)\nmodel.eval()   # before evaluation: the head has Dropout","lines":[["transforms.Resize(256),","Shorter side to 256 pixels, the standard ImageNet preprocessing."],["transforms.CenterCrop(224),","224x224 centre crop: VGG16's expected input size."],["transforms.ToTensor(),","PIL (H,W,C) uint8 0-255 -> tensor (C,H,W) float 0-1. This, not np.stack, does the channel reordering."],["transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])","ImageNet per-channel mean/std, so inputs match what the pretrained filters expect."],["image = image.astype(np.uint8)","PIL needs uint8 for an RGB image. Pixels are 0-255 here (not divided by 255)."],["image = np.stack([image]*3, axis=-1)","Grayscale (28,28) -> (28,28,3) by copying the channel. The comment says (C,H,W) but this is (H,W,C)."],["vgg16 = models.vgg16(pretrained=True)","Works but deprecated since torchvision 0.13 (the warning in your output); use weights=."],["param.requires_grad=False","Freezes all conv weights: no gradients, no updates, less memory."],["nn.Linear(25088, 1024),","25088 = 512 channels x 7 x 7, the flattened output of VGG's conv base + adaptive pooling."],["optimizer = optim.Adam(vgg16.classifier.parameters(), lr=learning_rate)","Only the new head is given to the optimizer; lr=1e-4 is gentle."]],"internals":"VGG16 = `features` (13 conv layers with ReLU and 5 max-pools, 224 -> 7 spatially) + `avgpool` (adaptive, outputs 7x7) + `classifier`. Setting requires_grad=False on the conv parameters means autograd doesn't record gradient paths into them, so backward stops at the first trainable layer. That saves compute and memory, but every forward still runs the full 224x224 conv stack, which is why the notebook needs a GPU. Assigning `vgg16.classifier = nn.Sequential(...)` replaces the registered submodule; the new layers start with random weights and requires_grad=True.","flow":[["digit 28x28","grayscale uint8"],["stack x3 + PIL","28x28x3"],["Resize/Crop/ToTensor/Normalize","3x224x224"],["VGG16 features (frozen)","512x7x7"],["new classifier","25088 -> 10"],["CrossEntropyLoss","train head only"]],"mistakes":[{"title":"Evaluating without model.eval()","wrong":"# evaluation on test data\nwith torch.no_grad():\n    outputs = vgg16(batch_features)","right":"vgg16.eval()\nwith torch.no_grad():\n    outputs = vgg16(batch_features)","why":"Your new head has two Dropout(0.5) layers. Without eval() half the activations are zeroed at random during testing, so accuracy is noisier and lower than it should be."},{"title":"Leftover debugging break in the training loop","wrong":"for batch_features, batch_labels in train_loader:\n    ...\n    print(outputs.shape)\n    print(batch_labels.shape)\n    break","right":"for batch_features, batch_labels in train_loader:\n    ...\n    total_epoch_loss += loss.item()","why":"From your history (commit e006c07). Each epoch trained on one batch. The stale outputs are still in the notebook: torch.Size([32, 10]) prints, loss 0.0046 (one batch's loss / 500), test accuracy 0.497."}],"practice":{"task":"Update the notebook to the modern weights API, add vgg16.eval() before both evaluation loops (and vgg16.train() before training), and count how many parameters are trainable vs frozen.","hint":"sum(p.numel() for p in model.parameters() if p.requires_grad).","solution":"from torchvision.models import vgg16, VGG16_Weights\nmodel = vgg16(weights=VGG16_Weights.DEFAULT)\nfor p in model.features.parameters():\n    p.requires_grad = False\n# replace classifier as before\ntrainable = sum(p.numel() for p in model.parameters() if p.requires_grad)\nfrozen = sum(p.numel() for p in model.parameters() if not p.requires_grad)\nprint(trainable, frozen)   # about 26.2M trainable, 14.7M frozen\nmodel.eval()   # before each evaluation loop"},"quiz":[{"q":"Why are the MNIST digits normalised with mean [0.485, 0.456, 0.406]?","o":["Those are MNIST's statistics","They're ImageNet's per-channel statistics, which VGG16's filters were trained on","Normalize requires these exact values","To convert grayscale to RGB"],"a":1,"x":"Pretrained features expect inputs distributed like the original training data."},{"q":"Where does 25088 in nn.Linear(25088, 1024) come from?","o":["224 x 112","512 channels x 7 x 7 after the conv base and pooling","The number of MNIST pixels x 32","A hyperparameter choice"],"a":1,"x":"VGG16's features + adaptive avgpool output 512x7x7, flattened to 25088."},{"q":"What does setting requires_grad=False on vgg16.features do?","o":["Removes those layers","Stops those weights from receiving gradients or updates","Speeds up the forward pass a lot","Puts them in eval mode"],"a":1,"x":"They still run in the forward pass but aren't trained. It doesn't change train/eval mode."}],"interview":[{"q":"Feature extraction vs fine-tuning: when would you use each?","d":"Medium","t":"Transfer learning strategy","a":"Feature extraction (freeze base, train head) when you have little data or the new domain is similar: fast and low risk of overfitting. Fine-tuning (unfreeze some or all of the base with a small learning rate) when you have more data or the domain differs, so features need adapting. Common practice: train the head first, then unfreeze top conv blocks with a 10x smaller LR.","m":"Unfreezing everything with a large learning rate, destroying the pretrained features.","f":"Is VGG16 on MNIST a similar domain to ImageNet? What would you do differently?"},{"q":"Does requires_grad=False make the forward pass faster?","d":"Medium","t":"What freezing actually saves","a":"Barely. The full conv stack still runs forward on every image. Freezing saves the backward computation into those layers, their gradient memory and optimizer state. For a real speed-up you can precompute features once (if no augmentation) and train the head on cached features.","m":"Believing frozen layers are skipped.","f":"How would you cache VGG16 features for this dataset?"},{"q":"Name three ways this notebook's evaluation could be misleading.","d":"Hard","t":"Critical reading of an eval loop","a":"1) No vgg16.eval(), so Dropout(0.5) is active at test time. 2) In Colab, pd.read_csv on mnist_train_small.csv without header=None turned the first image into column names (your df.head() shows columns '6', '0', '0.1'...), losing a sample. 3) The visible outputs (loss 0.0046, accuracy 0.497, the NameError) are stale, from before the break/model bugs were fixed, so they don't describe the current code.","m":"Looking only at the accuracy number.","f":"How do you make sure notebook outputs always match the code?"}],"cards":[["Feature extraction in PyTorch","Set requires_grad=False on the base, replace the head, pass only head params to the optimizer."],["ImageNet normalisation values","mean [0.485, 0.456, 0.406], std [0.229, 0.224, 0.225]."],["Modern way to load pretrained VGG16","models.vgg16(weights=models.VGG16_Weights.DEFAULT); pretrained=True is deprecated."],["Why call eval() before testing VGG16 here?","The new classifier has Dropout(0.5), which must be off at test time."]],"summary":"Load a pretrained model, match its input format (3 channels, 224x224, ImageNet normalisation), freeze the base with requires_grad=False, replace the classifier with your own head (25088 -> ... -> 10), optimise only the head with a small LR, call eval() before testing. Freezing saves backward cost, not forward cost. Use weights= instead of pretrained=.","code":"# transformations\nfrom torchvision.transforms import transforms\n\ncustom_transform = transforms.Compose([\n    transforms.Resize(256),\n    transforms.CenterCrop(224),\n    transforms.ToTensor(),\n    transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])\n])\n\nfrom PIL import Image\nimport numpy as np\n\nclass CustomDataset(Dataset):\n\n  def __init__(self, features, labels, transform):\n    self.features = features\n    self.labels = labels\n    self.transform = transform\n\n  def __len__(self):\n    return len(self.features)\n\n  def __getitem__(self, index):\n\n    # resize to (28, 28)\n    image = self.features[index].reshape(28,28)\n\n    # change datatype to np.uint8\n    image = image.astype(np.uint8)\n\n    # change black&white to color -> (H,W,C) -> (C,H,W)\n    image = np.stack([image]*3, axis=-1)\n\n    # convert array to PIL image\n    image = Image.fromarray(image)\n\n    # apply transforms\n    image = self.transform(image)\n\n    # return\n    return image, torch.tensor(self.labels[index], dtype=torch.long)\n\n# fetch the pretrained model\n\nimport torchvision.models as models\n\nvgg16 = models.vgg16(pretrained=True)\n\nfor param in vgg16.features.parameters():\n  param.requires_grad=False\n\nvgg16.classifier = nn.Sequential(\n    nn.Linear(25088, 1024),\n    nn.ReLU(),\n    nn.Dropout(0.5),\n    nn.Linear(1024, 512),\n    nn.ReLU(),\n    nn.Dropout(0.5),\n    nn.Linear(512, 10)\n)\n\ncriterion = nn.CrossEntropyLoss()\noptimizer = optim.Adam(vgg16.classifier.parameters(), lr=learning_rate)","code_src":"transfer_learning_fashion_mnist_pytorch_gpu (1).ipynb","code_cells":"8, 9, 13, 15, 16, 19","short":"VGG16 transfer","sub":"freeze + new head"},{"id":"rnn","title":"RNN for question answering","nb":"RNN.ipynb","concept":"Text to token ids, nn.Embedding, nn.RNN with batch_first, using the final hidden state to classify","apis":["tokenize()","vocab dict","<UNK> token","nn.Embedding","nn.RNN(batch_first=True)","hidden, final = rnn(x)","final.squeeze(0)","nn.CrossEntropyLoss","F.softmax","torch.max"],"what":"A tiny QA model: each question is tokenised, mapped to integer ids via a vocabulary, embedded into 50-dim vectors, read word by word by an RNN with a 64-dim hidden state, and the final hidden state is classified over the whole vocabulary to pick a one-word answer. 'WHat is capital of France' -> 'paris'.","why":"MLPs need fixed-size inputs and ignore order. Sentences have variable length and order matters. An RNN processes a sequence one step at a time, carrying a hidden state forward as a running summary, so it can handle any length with the same weights. This notebook is the bridge from tabular/image data to sequences, and the setup for the LSTM notebook.","mental":"Reading a sentence with a sticky note. At each word you read it, glance at your sticky note, and write a new note combining both. When the sentence ends, you hand the last note to someone who guesses the answer. The note has a fixed size (64 numbers), so long sentences must be squeezed into it.","syntax":"emb = nn.Embedding(vocab_size, 50)            # id -> 50-d vector\nrnn = nn.RNN(50, 64, batch_first=True)         # input (B, T, 50)\nfc  = nn.Linear(64, vocab_size)\n\nx = emb(token_ids)                             # (B, T) -> (B, T, 50)\noutputs, h_n = rnn(x)                          # (B, T, 64), (1, B, 64)\nlogits = fc(h_n.squeeze(0))                    # (B, vocab_size)","lines":[["text=text.lower()","Normalises case so 'WHat' and 'what' map to the same id."],["indexed_text.append(vocab['<UNK>'])","Unknown words fall back to id 0. Commit e006c07 fixed a version that raised KeyError here."],["return torch.tensor(numerical_question),torch.tensor(numerical_answer)","Variable-length tensors, which is why batch_size=1: default collate can't stack different lengths."],["self.embedding=nn.Embedding(vocab_size,embedding_dim=50)","A learnable lookup table: vocab_size rows of 50 numbers."],["self.rnn=nn.RNN(50,64,batch_first=True)","batch_first makes input (batch, seq, feature) instead of the default (seq, batch, feature)."],["hidden,final=self.rnn(embedded_question)","hidden = output at every step (B,T,64); final = last hidden state (num_layers, B, 64)."],["output=self.fc(final.squeeze(0))","Drops the num_layers dim: (1,B,64) -> (B,64), then scores every vocab word."],["loss=criterion(output,answer[0])","answer has shape (1,1); answer[0] gives (1,), the target class id."],["print(f\"Epoch {epoch+1},Loss:{total_loss:4f}\")","Sum of losses over the dataset, not the mean. ':4f' is width 4, not 4 decimals."],["if value<threshold:","Bug: prints 'IDK' and then still prints the answer below, because there's no else/return."]],"internals":"At each time step t, nn.RNN computes h_t = tanh(W_ih x_t + b_ih + W_hh h_{t-1} + b_hh), starting from h_0 = 0. The same W_ih and W_hh are reused at every step (weight sharing across time). Backprop through time unrolls this loop, and the gradient for early words is a product of many W_hh and tanh' factors, which shrinks or explodes exponentially with length: the vanishing/exploding gradient problem LSTMs were designed to fix. nn.Embedding's backward only updates the rows for ids that appeared in the batch.","flow":[["question text","tokenize, lower"],["vocab lookup","ids, <UNK> = 0"],["nn.Embedding","(1, T, 50)"],["nn.RNN","h_t = tanh(Wx + Uh)"],["final hidden","(1, 64)"],["Linear -> vocab","argmax = answer"]],"mistakes":[{"title":"'IDK' printed together with an answer","wrong":"if value < threshold:\n    print(\"IDK\")\nprint(list(vocab.keys())[index])","right":"if value < threshold:\n    print(\"IDK\")\n    return\nprint(list(vocab.keys())[index])","why":"Still in your predict(). A low-confidence prediction prints both lines, so the threshold never actually suppresses an answer."},{"title":"forward() reading a global instead of its argument","wrong":"def forward(self, x):\n    embedded_question = self.embedding(question)   # global!","right":"def forward(self, x):\n    embedded_question = self.embedding(x)","why":"From your history (commit e006c07). In a notebook the global 'question' happened to exist from the DataLoader loop, so the model ran, but on the wrong input."}],"practice":{"task":"Rewrite predict() so it: switches to eval mode, runs under no_grad, returns (answer, confidence) instead of printing, and returns ('IDK', confidence) when below threshold.","hint":"value.item() gives a Python float.","solution":"def predict(model, question, threshold=0.5):\n    model.eval()\n    ids = torch.tensor(text_to_indices(question, vocab)).unsqueeze(0)\n    with torch.no_grad():\n        prob = torch.softmax(model(ids), dim=1)\n    value, index = prob.max(dim=1)\n    if value.item() < threshold:\n        return 'IDK', value.item()\n    return list(vocab.keys())[index.item()], value.item()"},"quiz":[{"q":"With batch_first=True, what shape does nn.RNN expect?","o":["(seq_len, batch, features)","(batch, seq_len, features)","(batch, features)","(features, seq_len)"],"a":1,"x":"batch_first flips the default (seq, batch, feature) layout."},{"q":"What is 'final' in hidden, final = self.rnn(x)?","o":["The output at every time step","The last hidden state, shape (num_layers, batch, hidden)","The loss","The embedding"],"a":1,"x":"For a 1-layer RNN that's (1, B, 64), hence the squeeze(0)."},{"q":"Why does this notebook use batch_size=1?","o":["RNNs only accept one sample","Questions have different lengths and default collate can't stack them","To use less memory","Shuffling requires it"],"a":1,"x":"Padding (as in the LSTM notebook) or pack_padded_sequence would allow larger batches."}],"interview":[{"q":"Explain the vanishing gradient problem in RNNs.","d":"Medium","t":"Backprop through time","a":"The gradient of the loss with respect to an early hidden state is a product of Jacobians, one per time step, each involving W_hh and tanh'. If their norms are below 1 the product shrinks exponentially with sequence length (vanishing), so early words barely affect learning; above 1, it explodes. Fixes: LSTM/GRU gating, gradient clipping (for explosion), careful init, shorter sequences or attention.","m":"Saying it's caused by the learning rate.","f":"Which of these does gradient clipping address, and how do you call it in PyTorch?"},{"q":"What is an embedding layer and how is it different from one-hot encoding?","d":"Easy","t":"Representing tokens","a":"nn.Embedding is a learnable lookup table mapping each token id to a dense vector (50-d here). One-hot vectors are vocab-sized, sparse and all equally distant; embeddings are compact and learn so that related words get similar vectors. An embedding lookup is mathematically a one-hot times a weight matrix, just computed efficiently.","m":"Thinking embeddings must be pretrained (like word2vec); here they're learned from scratch.","f":"How does the embedding gradient differ from a Linear layer's gradient?"},{"q":"This model treats QA as classification over the vocabulary. What are the limitations?","d":"Hard","t":"Problem framing","a":"It can only output one token, only one already in the vocabulary, and must memorise answers rather than retrieve them; with 100 Q&A pairs it can't generalise to new facts. The vocab includes question words, so it can 'answer' with 'what'. Real QA uses span extraction or seq2seq generation, usually with attention or Transformers.","m":"Evaluating it on the training questions and calling it accurate.","f":"How would you evaluate whether it generalises at all?"}],"cards":[["RNN update rule","h_t = tanh(W_ih x_t + W_hh h_{t-1} + b)"],["nn.RNN returns","(output for every step, final hidden state of shape (layers, B, H))."],["Purpose of the <UNK> token","Gives unknown words a valid id instead of raising KeyError."],["Why batch_size=1 in the RNN notebook?","Variable-length sequences can't be stacked without padding."]],"summary":"Tokenise, build a vocab with <UNK>, map words to ids, nn.Embedding to vectors, nn.RNN(batch_first=True) to read the sequence, classify the final hidden state (squeeze the layer dim). Same weights at every time step. Long sequences make gradients vanish or explode. Fix predict() so the IDK branch returns.","code":"def tokenize(text):\n  text=text.lower()\n  text=text.replace(\"?\",\"\")\n  text=text.replace(\"'\",\"\")\n  return text.split()\n\ndef text_to_indices(text,vocab):\n  indexed_text=[]\n  for token in tokenize(text):\n    if token in vocab:\n      indexed_text.append(vocab[token])\n    else:\n      indexed_text.append(vocab['<UNK>'])\n  return indexed_text\n\nclass QADatatset(Dataset):\n  def __init__(self,df,vocab):\n    self.df=df\n    self.vocab=vocab\n\n  def __len__(self):\n    return self.df.shape[0]\n\n  def __getitem__(self, index):\n    numerical_question=text_to_indices(self.df.iloc[index]['question'],self.vocab)\n    numerical_answer=text_to_indices(self.df.iloc[index]['answer'],self.vocab)\n\n    return torch.tensor(numerical_question),torch.tensor(numerical_answer)\n\nclass SimpleRNN(nn.Module):\n  def __init__(self,vocab_size):\n    super().__init__()\n    self.embedding=nn.Embedding(vocab_size,embedding_dim=50)\n    self.rnn=nn.RNN(50,64,batch_first=True)\n    self.fc=nn.Linear(64,vocab_size)\n\n  def forward(self,x):\n    embedded_question=self.embedding(x)\n    hidden,final=self.rnn(embedded_question)\n    output=self.fc(final.squeeze(0))\n    return output\n\nfor epoch in range(epochs):\n  total_loss=0\n  for question, answer in dataloader:\n    optimizer.zero_grad()\n    output=model(question)\n    loss=criterion(output,answer[0])\n    loss.backward()\n    optimizer.step()\n    total_loss=total_loss+loss.item()\n  print(f\"Epoch {epoch+1},Loss:{total_loss:4f}\")\n\ndef predict(model,question,threshold=0.5):\n  numerical_ques=text_to_indices(question,vocab)\n  question_tensor=torch.tensor(numerical_ques).unsqueeze(0)\n  output=model(question_tensor)\n  prob=torch.nn.functional.softmax(output,dim=1)\n  value,index=torch.max(prob,dim=1)\n  if value<threshold:\n    print(\"IDK\")\n  print(list(vocab.keys())[index])","code_src":"RNN.ipynb","code_cells":"1, 7, 10, 15, 20, 21","short":"RNN QA","sub":"Embedding, nn.RNN"},{"id":"lstm","title":"LSTM next-word predictor","nb":"pytorch_lstm_next_word_predictor.ipynb","concept":"Language modelling: prefix sequences, left-padding, nn.LSTM with (h, c) state, autoregressive generation","apis":["nltk.word_tokenize","Counter","prefix training sequences","left padding","nn.Embedding","nn.LSTM(batch_first=True)","output, (h_n, c_n)","model.to(device)","torch.max","autoregressive loop"],"what":"A next-word predictor trained on an FAQ document. Each line is turned into every prefix ('the course' -> 'follows', 'the course follows' -> 'a', ...), left-padded with zeros to length 62, and an LSTM learns to predict the last token from the rest. At inference it generates text by repeatedly predicting a word and appending it: 'hi how are' -> ', will i be informed about the upcoming class ?'.","why":"It fixes the RNN notebook's two problems: padding allows real mini-batches (32 at a time), and the LSTM's gated cell state keeps information over longer spans without vanishing gradients. It's also the same autoregressive idea modern language models use, at toy scale.","mental":"The LSTM has the RNN's sticky note (hidden state) plus a notebook (cell state) with three valves. The forget gate decides what to erase from the notebook, the input gate what to write, and the output gate what to copy onto the sticky note. Because the notebook is updated by adding rather than repeatedly squashing, information and gradients survive many steps.","syntax":"self.lstm = nn.LSTM(100, 150, batch_first=True)\noutput, (h_n, c_n) = self.lstm(embedded)   # (B,T,150), (1,B,150), (1,B,150)\nlogits = self.fc(h_n.squeeze(0))           # (B, vocab)\n\n# generation\nfor _ in range(n):\n    ids = pad(tokenize(text)).unsqueeze(0).to(device)\n    next_id = model(ids).argmax(dim=1)\n    text += ' ' + itos[next_id.item()]","lines":[["training_sequence.append(sentence[:i+1])","Every prefix of length 2 or more becomes a training example: 78 lines -> 942 sequences."],["padded_training_sequence.append([0]*(max(len_list) - len(sequence)) + sequence)","Left-pads with 0 to length 62, so the real words sit next to the final hidden state."],["X = padded_training_sequence[:, :-1]","Input: all tokens but the last (length 61)."],["y = padded_training_sequence[:,-1]","Target: the last token, the 'next word'."],["self.lstm = nn.LSTM(100, 150, batch_first=True)","100-dim embeddings in, 150-dim hidden and cell states."],["intermediate_hidden_states, (final_hidden_state, final_cell_state) = self.lstm(embedded)","LSTM returns a tuple (h_n, c_n) as its state, unlike RNN's single h_n."],["print(f\"Epoch: {epoch + 1}, Loss: {total_loss:.4f}\")","Summed over 30 batches, so 164.8 means about 5.5 per batch at the start."],["padded_text = torch.tensor([0] * (61 - len(numerical_text)) + numerical_text, dtype=torch.long).unsqueeze(0)","Hard-coded 61 = max_len - 1. Stays on the CPU, which crashes if the model is on a GPU."],["value, index = torch.max(output, dim=1)","Greedy decoding: always take the most likely next word."]],"internals":"Per step, the LSTM computes four gate pre-activations from [x_t, h_{t-1}] in one matmul: i, f, o = sigmoid(...) and g = tanh(...). Then c_t = f*c_{t-1} + i*g and h_t = o*tanh(c_t). The additive update of c_t means the gradient along the cell path is multiplied by f (close to 1 when the model wants to remember) rather than by repeated W_hh and tanh' factors, so it decays far more slowly. Padding id 0 is embedded like any other token, so the LSTM also 'reads' the padding; left-padding keeps the real tokens closest to h_n, which limits the damage.","flow":[["document","lines -> tokens"],["prefixes","942 sequences"],["left-pad to 62","X = [:, :-1], y = [:, -1]"],["Embedding -> LSTM","(h_n, c_n)"],["Linear","logits over 289 words"],["argmax, append","repeat to generate"]],"mistakes":[{"title":"Inference tensor not moved to the model's device","wrong":"padded_text = torch.tensor([...], dtype=torch.long).unsqueeze(0)\noutput = model(padded_text)","right":"padded_text = torch.tensor([...], dtype=torch.long).unsqueeze(0).to(device)\noutput = model(padded_text)","why":"Still in prediction(). It ran on your Mac because device was CPU there. On a CUDA GPU it raises RuntimeError: Expected all tensors to be on the same device."},{"title":"Function ignores its parameter and reads a global","wrong":"def calculate_accuracy(model, dataloader, device):\n    for batch_x, batch_y in dataloader1:   # global","right":"def calculate_accuracy(model, dataloader, device):\n    for batch_x, batch_y in dataloader:","why":"Still in the notebook. It gives the right number only because the global happens to hold the same data. Same pattern as the pipeline's loss_function and the old RNN forward()."}],"practice":{"task":"Make prediction() robust: move the input to device, compute the pad length from X.shape[1] instead of 61, truncate inputs longer than that, and use sampling with a temperature instead of greedy argmax.","hint":"torch.multinomial(torch.softmax(logits / T, dim=1), 1) samples one id.","solution":"def prediction(model, vocab, text, T=1.0):\n    model.eval()\n    ids = text_to_indices(word_tokenize(text.lower()), vocab)\n    L = X.shape[1]\n    ids = ids[-L:]\n    x = torch.tensor([0]*(L - len(ids)) + ids).unsqueeze(0).to(device)\n    with torch.no_grad():\n        probs = torch.softmax(model(x) / T, dim=1)\n    nxt = torch.multinomial(probs, 1).item()\n    return text + ' ' + list(vocab.keys())[nxt]"},"quiz":[{"q":"What does nn.LSTM return that nn.RNN doesn't?","o":["Outputs for every step","A cell state c_n alongside h_n","A loss value","Attention weights"],"a":1,"x":"LSTM returns output, (h_n, c_n). The cell state is the long-term memory path."},{"q":"Why left-pad (zeros before the words) instead of right-pad?","o":["Right padding is not allowed","So the real tokens are processed last and are freshest in the final hidden state","It's faster","To make the vocab smaller"],"a":1,"x":"The model reads h_n after the last step; with right padding that step would be padding."},{"q":"Your model reports 95.65% accuracy. On what data?","o":["A held-out test set","The same 942 training sequences","A validation split","Random text"],"a":1,"x":"calculate_accuracy runs over the training dataset, so 95.65% measures memorisation, not generalisation."}],"interview":[{"q":"How does the LSTM cell state help with vanishing gradients?","d":"Medium","t":"LSTM mechanics","a":"c_t = f*c_{t-1} + i*g is updated additively. Backprop along the cell path multiplies by the forget gate f at each step instead of by W_hh times tanh'. When f is near 1 gradients pass through almost unchanged (the 'constant error carousel'), so the model can learn dependencies over many steps.","m":"Saying LSTMs eliminate vanishing gradients entirely; they mitigate it.","f":"How does a GRU simplify this, and when would you pick it?"},{"q":"Padding id 0 is also <unk>. Why is that a problem, and how would you fix it?","d":"Medium","t":"Sequence data hygiene","a":"The model can't tell padding from a genuinely unknown word, and it 'reads' padding as input. Fix: reserve separate <pad>=0 and <unk>=1 ids, use nn.Embedding(padding_idx=0) so padding has a zero vector that isn't trained, and ideally pack_padded_sequence so the LSTM skips padding entirely.","m":"Ignoring padding because accuracy looks high.","f":"What does pack_padded_sequence need from you?"},{"q":"Greedy decoding vs sampling vs beam search?","d":"Medium","t":"Text generation","a":"Greedy takes the argmax each step: deterministic but repetitive and can miss better sequences. Sampling (with temperature, top-k or top-p) adds diversity. Beam search keeps the k best partial sequences: better for tasks with one correct output (translation), but often bland for open-ended text.","m":"Assuming argmax gives the most likely overall sentence.","f":"What does temperature < 1 do to the distribution?"}],"cards":[["LSTM cell update","c_t = f*c_{t-1} + i*g;  h_t = o*tanh(c_t)"],["nn.LSTM output signature","output, (h_n, c_n)"],["How are next-word training pairs built here?","Every prefix of each line: X = all but last token, y = last token."],["Why is the 95.65% accuracy misleading?","It's measured on the training data, not a held-out set."]],"summary":"Build prefix sequences, left-pad, split X/y as all-but-last/last. Embedding -> LSTM -> Linear on h_n. LSTM adds a gated, additively-updated cell state, so it remembers longer than an RNN. Generate autoregressively. Move inference inputs to device, don't hard-code 61, separate <pad> from <unk>, evaluate on held-out text, and pass parameters instead of reading globals.","code":"training_sequence = []\nfor sentence in input_numerical_sentences:\n\n  for i in range(1, len(sentence)):\n    training_sequence.append(sentence[:i+1])\n\npadded_training_sequence = []\nfor sequence in training_sequence:\n\n  padded_training_sequence.append([0]*(max(len_list) - len(sequence)) + sequence)\n\nX = padded_training_sequence[:, :-1]\ny = padded_training_sequence[:,-1]\n\nclass LSTMModel(nn.Module):\n\n  def __init__(self, vocab_size):\n    super().__init__()\n    self.embedding = nn.Embedding(vocab_size, 100)\n    self.lstm = nn.LSTM(100, 150, batch_first=True)\n    self.fc = nn.Linear(150, vocab_size)\n\n  def forward(self, x):\n    embedded = self.embedding(x)\n    intermediate_hidden_states, (final_hidden_state, final_cell_state) = self.lstm(embedded)\n    output = self.fc(final_hidden_state.squeeze(0))\n    return output\n\n# training loop\n\nfor epoch in range(epochs):\n  total_loss = 0\n\n  for batch_x, batch_y in dataloader:\n\n    batch_x, batch_y = batch_x.to(device), batch_y.to(device)\n\n    optimizer.zero_grad()\n\n    output = model(batch_x)\n\n    loss = criterion(output, batch_y)\n\n    loss.backward()\n\n    optimizer.step()\n\n    total_loss = total_loss + loss.item()\n\n  print(f\"Epoch: {epoch + 1}, Loss: {total_loss:.4f}\")\n\n# prediction\n\ndef prediction(model, vocab, text):\n\n  # tokenize\n  tokenized_text = word_tokenize(text.lower())\n\n  # text -> numerical indices\n  numerical_text = text_to_indices(tokenized_text, vocab)\n\n  # padding\n  padded_text = torch.tensor([0] * (61 - len(numerical_text)) + numerical_text, dtype=torch.long).unsqueeze(0)\n\n  # send to model\n  output = model(padded_text)\n\n  # predicted index\n  value, index = torch.max(output, dim=1)\n\n  # merge with text\n  return text + \" \" + list(vocab.keys())[index]","code_src":"pytorch_lstm_next_word_predictor.ipynb","code_cells":"11, 16, 20, 27, 32, 33","short":"LSTM next word","sub":"(h, c), generation"}],"order":["basics","gpu","autograd","nnmodule","pipeline","pipeline_nn","dataloader","ann","regularization","optuna","transfer","rnn","lstm"],"edges":[{"from":"basics","to":"gpu","why":"Tensors gain a device; same ops, different hardware."},{"from":"basics","to":"autograd","why":"Autograd tracks the tensor ops you learned."},{"from":"basics","to":"nnmodule","why":"nn.Linear is matmul + bias over tensors."},{"from":"autograd","to":"pipeline","why":"The manual loop is backward() + .grad + no_grad updates."},{"from":"nnmodule","to":"pipeline_nn","why":"MySimpleNN replaces the hand-made weight tensors."},{"from":"pipeline","to":"pipeline_nn","why":"Same data and loop; BCELoss and SGD replace manual code."},{"from":"pipeline_nn","to":"dataloader","why":"Same model; full-batch becomes mini-batch."},{"from":"dataloader","to":"ann","why":"CustomDataset + DataLoader reused for MNIST."},{"from":"ann","to":"regularization","why":"Same MLP plus BatchNorm, Dropout, weight decay."},{"from":"gpu","to":"regularization","why":"First notebook that trains with model.to(device)."},{"from":"regularization","to":"optuna","why":"The regularised MLP becomes configurable and tuned."},{"from":"regularization","to":"transfer","why":"Same MNIST loader and GPU loop; pretrained CNN instead of MLP."},{"from":"ann","to":"rnn","why":"Same CrossEntropyLoss loop, now over token sequences."},{"from":"rnn","to":"lstm","why":"Embedding -> recurrent -> Linear, with an LSTM and padding."}],"layout":{"basics":[1,0],"gpu":[0,1],"nnmodule":[1,1],"autograd":[2,1],"pipeline":[2,2],"pipeline_nn":[1,3],"dataloader":[1,4],"ann":[1,5],"regularization":[0,6],"rnn":[2,6],"optuna":[0,7],"transfer":[1,7],"lstm":[2,7]},"bugs":[{"id":"nan-loss","title":"NaN loss in every epoch","where":"pytorch_training_pipeline.ipynb, SimpleNN.loss_function","kind":"Live in repo","topic":"pipeline","err":"nan 0\nnan 1\n...\nnan 24      (printed loss, no exception)","why":"loss_function defines epsilon = 1e-7 but never clamps y_pred. Weights start in [0, 1) across 30 correlated standardised features, so some z values are large enough that sigmoid(z) rounds to exactly 1.0 in float64. Then log(1 - 1.0) = -inf, and a 0 label times -inf is nan. The function also reads the global y_train_tensor instead of its y parameter.","recognize":"Loss is nan from the very first epoch, not after a few. That points at the first forward pass (bad values or log(0)), not at a learning rate that slowly diverges.","debug":"Print y_pred.min(), y_pred.max() before the loss; check torch.isnan(loss); wrap the loop in torch.autograd.set_detect_anomaly(True) to locate the op producing nan; grep the function for unused variables (epsilon) and globals.","buggy":"def loss_function(self, y_pred, y):\n    epsilon = 1e-7\n    # Calculate loss\n    loss = -(y_train_tensor * torch.log(y_pred) + (1 - y_train_tensor)*torch.log(1 - y_pred)).mean()\n    return loss","fixed":"def loss_function(self, y_pred, y):\n    epsilon = 1e-7\n    y_pred = torch.clamp(y_pred, epsilon, 1 - epsilon)\n    loss = -(y * torch.log(y_pred) + (1 - y) * torch.log(1 - y_pred)).mean()\n    return loss","iq":"Loss is nan at epoch 0. Name three possible causes and how you'd tell them apart.","ia":"(1) nan/inf in the input data: torch.isnan(X).any(). (2) log(0) or division by zero in the loss: inspect prediction range, clamp, or use BCEWithLogitsLoss. (3) Exploding activations from bad init or unscaled inputs: print activation norms per layer. A learning-rate problem typically shows finite losses that grow first.","recon":false},{"id":"broadcast-acc","title":"55% accuracy from a broadcasting comparison","where":"pytorch_training_pipeline_using_nn_module.ipynb and _updated.ipynb, evaluation cell (also pytorch_training_pipeline.ipynb)","kind":"Live in repo","topic":"pipeline_nn","err":"Accuracy: 0.5526315569877625\nAccuracy: 0.5497075915336609      (no exception)","why":"y_pred has shape (114, 1); y_test_tensor has shape (114,). Comparing them broadcasts to (114, 114), every prediction against every label. The mean of that grid is about the fraction of label pairs that happen to agree, which sits near 55% for a 63/37 class split regardless of how good the model is.","recognize":"Training loss is low (about 0.15) but accuracy is near the class-balance baseline. Any time a metric doesn't move when the model clearly improves, suspect shapes.","debug":"Print shapes of both operands right before the comparison, or print the shape of (y_pred == y_test_tensor): it will say torch.Size([114, 114]). Add assert a.shape == b.shape guards in metric code.","buggy":"with torch.no_grad():\n  y_pred = model.forward(X_test_tensor)\n  y_pred = (y_pred > 0.5).float()\n  accuracy = (y_pred == y_test_tensor).float().mean()","fixed":"with torch.no_grad():\n  y_pred = model(X_test_tensor)\n  y_pred = (y_pred > 0.5).float().view(-1)\n  assert y_pred.shape == y_test_tensor.shape\n  accuracy = (y_pred == y_test_tensor).float().mean()","iq":"Which PyTorch operations check shapes strictly and which broadcast silently? Give an example of each from your code.","ia":"Losses like BCELoss and MSELoss check or warn about mismatched sizes (your training loop needed .view(-1,1) for BCELoss). Elementwise arithmetic and comparisons (+, *, ==) broadcast silently, which is how (114,1) == (114,) became (114,114). matmul checks inner dims.","recon":false},{"id":"backward-const","title":"backward() on a tensor with no graph","where":"Auto_Grad_Back.ipynb, last cell","kind":"Live in repo","topic":"autograd","err":"RuntimeError: element 0 of tensors does not require grad and does not have a grad_fn","why":"y is the target label torch.tensor(0.0): a constant with requires_grad=False and no grad_fn. There's nothing to differentiate. The same cell then calls torch.no_grad() as a bare statement, which creates the context-manager object and discards it without disabling anything.","recognize":"The error names 'does not require grad and does not have a grad_fn'. Check what you called backward on: it should be a scalar loss computed from parameters that require grad.","debug":"Print t.requires_grad and t.grad_fn for the tensor you're calling backward on. If grad_fn is None and it isn't a leaf with requires_grad, it's disconnected: maybe computed under no_grad, from detached tensors, or it's just data.","buggy":"z=x**2\nz\ny.backward()\ntorch.no_grad()","fixed":"w = torch.tensor(1.0, requires_grad=True)\nloss = binary_cross_entropy_loss(torch.sigmoid(w * x + b), y)\nloss.backward()\nwith torch.no_grad():\n    w -= 0.1 * w.grad","iq":"Your loss has grad_fn=None even though the model has parameters. What could cause that?","ia":"The forward pass ran inside torch.no_grad() (an eval block left open), a tensor in the chain was .detach()ed or converted via .item()/.numpy() and back, parameters were frozen with requires_grad=False, or the loss was computed from labels only.","recon":false},{"id":"rand-like","title":"rand_like on an integer tensor","where":"PyTorch_Basics.ipynb, Tensor Shape section","kind":"Live in repo","topic":"basics","err":"NotImplementedError: \"check_uniform_bounds\" not implemented for 'Long'","why":"x was created from Python ints, so its dtype is int64 (Long). rand_like copies the dtype by default, and uniform [0, 1) sampling isn't defined for integers.","recognize":"'not implemented for Long' (or 'Int', 'Bool') means an op received an integer tensor where it needs floats. Check .dtype.","debug":"Print x.dtype. Tensors from integer literals are int64; from float literals float32; from NumPy they keep NumPy's dtype.","buggy":"x=torch.tensor([[1,2,3],[1,2,3]])\ntorch.rand_like(x)","fixed":"x=torch.tensor([[1,2,3],[1,2,3]])\ntorch.rand_like(x, dtype=torch.float32)","iq":"What default dtypes does torch.tensor() pick, and how can dtype mismatches bite you later in a model?","ia":"int literals -> int64, float literals -> float32 (the default dtype), bool -> bool. Later, int labels are needed for CrossEntropyLoss but float labels for BCELoss, and float64 inputs from NumPy clash with float32 weights ('mat1 and mat2 must have the same dtype').","recon":false},{"id":"discarded-unsqueeze","title":"Discarded unsqueeze makes squeeze a no-op","where":"PyTorch_On_GPU.ipynb, reshaping cells","kind":"Live in repo","topic":"gpu","err":"torch.Size([226, 226, 3])      (no exception; squeeze appears to 'work')","why":"c.unsqueeze(0,).shape builds a (1,226,226,3) tensor, prints its shape and throws it away. c is still (226,226,3). c.squeeze(0) then looks at dim 0, which has size 226, and does nothing. The output looks like an undo, but nothing was undone.","recognize":"A shape-changing call whose result isn't assigned. Most tensor methods return new tensors; only the trailing-underscore versions
