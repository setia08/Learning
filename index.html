sigmoid","title":"Layer named relu is a Sigmoid","where":"NN_Module_updated.ipynb, Model.__init__","kind":"Live in repo","topic":"nnmodule","err":"(none; model trains and prints outputs around 0.61)","why":"self.relu = nn.Sigmoid(). Either the intent was ReLU and the hidden layer uses the wrong activation, or the name is wrong. Both mislead readers, and sigmoid hidden units saturate and train slower.","recognize":"Names that describe a different thing from the object. Print the model: the repr shows (relu): Sigmoid().","debug":"print(model) lists every submodule with its real class. Review it whenever you write a new architecture.","buggy":"self.linear1 = nn.Linear(num_features, 3)\nself.relu = nn.Sigmoid()\nself.linear2 = nn.Linear(3, 1)","fixed":"self.linear1 = nn.Linear(num_features, 3)\nself.relu = nn.ReLU()\nself.linear2 = nn.Linear(3, 1)","iq":"Why is ReLU usually preferred to sigmoid in hidden layers?","ia":"Sigmoid's derivative is at most 0.25 and near 0 for large |z|, so gradients shrink through layers (vanishing gradients) and it isn't zero-centred. ReLU has gradient 1 for positive inputs, is cheap, and trains deep nets faster. Sigmoid stays appropriate for binary output probabilities.","recon":false},{"id":"getitem-labels","title":"__getitem__ returns every label","where":"Full_pytorch_training_pipeline_using_nn_module.ipynb, CustomDataset (fixed in f53e4a6)","kind":"Fixed in history","topic":"dataloader","err":"ValueError: Using a target size (torch.Size([14560, 1])) that is different to the input size (torch.Size([32, 1])) is deprecated. Please ensure they have the same size.","why":"__getitem__ returned self.lables (the full 455-element tensor) instead of self.lables[index]. Collate stacked 32 copies into (32, 455); .view(-1, 1) then made 14560 targets for 32 predictions.","recognize":"A target size that is a multiple of the dataset size, or batch labels with an extra dimension equal to len(dataset).","debug":"Index the dataset directly: x, y = train_dataset[0]; print(x.shape, y.shape). y should be a scalar here. Then check one batch from the loader before training.","buggy":"def __getitem__(self,index):\n    return self.features[index],self.lables","fixed":"def __getitem__(self,index):\n    return self.features[index],self.lables[index]","iq":"What sanity checks do you run on a new Dataset/DataLoader before training?","ia":"len(dataset) matches expectations; dataset[0] returns the right types, shapes and dtypes; one batch from the loader has shape (B, ...) for x and (B,) for y; label values are in range; a few samples visualised or printed alongside labels to catch misalignment; and overfit a single batch to near-zero loss.","recon":true},{"id":"optuna-optimizer","title":"Searched optimizer never used","where":"ANN_using_Pytorch_with_Optuna.ipynb, objective() (fixed in 4736191)","kind":"Fixed in history","topic":"optuna","err":"(none; trials finish normally with plausible accuracies)","why":"The Adam/SGD/RMSprop optimizer chosen by the trial was constructed but not assigned back to the optimizer variable, so the training loop always used a hard-coded SGD. The optimizer and weight_decay search dimensions had no effect, and best_params reported values that were never actually used.","recognize":"A searched hyperparameter whose value doesn't correlate with results at all, or results identical across trials that differ only in that parameter.","debug":"Log type(optimizer).__name__ and optimizer.defaults inside the trial. Run two trials forcing different values (optuna's enqueue_trial) and confirm different behaviour.","buggy":"optimizer = optim.SGD(model.parameters(), lr=0.1)\nif optimizer_name == 'Adam':\n    optim.Adam(model.parameters(), lr=learning_rate, weight_decay=weight_decay)\nelif ...","fixed":"if optimizer_name == 'Adam':\n    optimizer = optim.Adam(model.parameters(), lr=learning_rate, weight_decay=weight_decay)\nelif optimizer_name == 'SGD':\n    optimizer = optim.SGD(model.parameters(), lr=learning_rate, weight_decay=weight_decay)\nelse:\n    optimizer = optim.RMSprop(model.parameters(), lr=learning_rate, weight_decay=weight_decay)","iq":"How do you make experiment code resistant to 'silently ignored config' bugs?","ia":"Build components from config in one factory function, log the actual instantiated objects (not just the config), add assertions that config values reach their destination, and keep a test that changes each parameter and checks the behaviour changes.","recon":true},{"id":"test-leak","title":"Hyperparameters chosen on the test set","where":"ANN_using_Pytorch_with_Optuna.ipynb, objective() returns test accuracy","kind":"Live in repo","topic":"optuna","err":"(none; best_value = 0.973 looks great)","why":"objective() evaluates on test_loader and Optuna maximises that. The test set is effectively part of model selection, so 0.973 is an optimistic estimate of performance on unseen data.","recognize":"The same loader is used both inside the tuning objective and for the final reported number.","debug":"Trace which split each metric uses. There should be three: train (fit), validation (tune / early stop), test (report once).","buggy":"  with torch.no_grad():\n    for batch_features, batch_labels in test_loader:\n      ...\n    accuracy = correct/total\n  return accuracy","fixed":"X_tr, X_val, y_tr, y_val = train_test_split(X_train, y_train, test_size=0.1, random_state=42)\n# objective() trains on X_tr and returns accuracy on X_val\n# final model: retrain with best_params, evaluate test_loader once","iq":"Why is tuning on the test set a problem if you never train on it?","ia":"Selection is a form of fitting: choosing the configuration that scores best on test overfits to the noise in that specific test set. The more trials, the stronger the bias. A held-out test set is only unbiased if it's used once, after all decisions are made.","recon":false},{"id":"vgg-break","title":"Leftover debug break trains one batch per epoch","where":"transfer_learning_fashion_mnist_pytorch_gpu (1).ipynb, training loop (fixed in e006c07; stale outputs remain)","kind":"Fixed in history","topic":"transfer","err":"torch.Size([32, 10])\ntorch.Size([32])\nEpoch: 1 , Loss: 0.004630527496337891","why":"A print + break used to check shapes was left inside the batch loop. Each epoch ran one batch, then divided that single loss by len(train_loader) = 500, giving the tiny 0.0046. Test accuracy after 10 one-batch epochs: 0.497.","recognize":"Suspiciously small loss that barely changes, epochs that finish instantly, or debug prints in the training output.","debug":"Count iterations per epoch and compare with len(train_loader). Search training loops for break/return/print before committing.","buggy":"  for batch_features, batch_labels in train_loader:\n    ...\n    optimizer.step()\n    print(outputs.shape)\n    print(batch_labels.shape)\n    break","fixed":"  for batch_features, batch_labels in train_loader:\n    ...\n    optimizer.step()\n    total_epoch_loss = total_epoch_loss + loss.item()","iq":"How would you structure a quick shape check without risking leaving it in the training loop?","ia":"Run one batch through the model in a separate cell (xb, yb = next(iter(train_loader)); print(model(xb).shape)), or use a max_steps / debug flag in the loop, or an assertion that stays permanently.","recon":true},{"id":"vgg-nameerror","title":"Evaluation calls an undefined model","where":"transfer_learning_fashion_mnist_pytorch_gpu (1).ipynb, train-set evaluation cell (fixed in e006c07; error output still saved)","kind":"Fixed in history","topic":"transfer","err":"NameError: name 'model' is not defined","why":"The evaluation code was copied from the MNIST notebooks where the network is called model. In this notebook it's vgg16. The saved error output was never re-run, so it's still visible under the fixed code.","recognize":"NameError on a common variable name right after copying a cell from another notebook.","debug":"Restart kernel and Run All before committing; that also refreshes stale outputs. Wrap evaluation in a function that takes the model as a parameter.","buggy":"outputs = model(batch_features)","fixed":"def evaluate(net, loader):\n    net.eval(); correct = total = 0\n    with torch.no_grad():\n        for xb, yb in loader:\n            xb, yb = xb.to(device), yb.to(device)\n            correct += (net(xb).argmax(1) == yb).sum().item(); total += yb.size(0)\n    return correct / total\n\nevaluate(vgg16, train_loader)","iq":"What risks come from notebook hidden state, and how do you guard against them?","ia":"Cells run out of order can leave variables defined that the code no longer creates (like the global question in RNN forward), outputs that don't match code (this NameError, the int-looking float tensors in PyTorch_Basics), and stale imports. Guard with Restart and Run All, functions with explicit parameters, and moving stable code into .py modules.","recon":true},{"id":"vgg-eval","title":"Dropout active during VGG16 evaluation","where":"transfer_learning_fashion_mnist_pytorch_gpu (1).ipynb, both evaluation cells","kind":"Live in repo","topic":"transfer","err":"(none; accuracy is lower and changes between runs)","why":"The new classifier contains two nn.Dropout(0.5). Without vgg16.eval(), the model stays in training mode, so half of the classifier's activations are dropped at random during test. torch.no_grad() only stops gradient tracking; it doesn't change mode.","recognize":"Evaluation accuracy that varies from run to run with the same weights, or that is lower than expected; any eval loop without .eval() on a model with Dropout or BatchNorm.","debug":"Check model.training before evaluating (it should be False). Run evaluation twice; with eval() the results must be identical.","buggy":"# evaluation on test data\ntotal = 0\ncorrect = 0\nwith torch.no_grad():\n  for batch_features, batch_labels in test_loader:\n    ...","fixed":"vgg16.eval()\ntotal = 0\ncorrect = 0\nwith torch.no_grad():\n  for batch_features, batch_labels in test_loader:\n    ...\nvgg16.train()","iq":"What's the difference between model.eval() and torch.no_grad()? Do you need both?","ia":"eval() changes layer behaviour (Dropout off, BatchNorm uses running stats). no_grad() disables graph recording to save memory and time. They're independent; for evaluation you want both. torch.inference_mode() is a stricter, faster no_grad.","recon":false},{"id":"csv-header","title":"First MNIST image swallowed as a header","where":"ANN and transfer notebooks, Colab path pd.read_csv(CSV_PATH)","kind":"Live in repo","topic":"transfer","err":"df.head() columns:  6  0  0.1  0.2  0.3 ...    df.shape: (19999, 785)","why":"Colab's mnist_train_small.csv has no header row. pd.read_csv assumes one, so the first image's values become column names (pandas de-duplicates repeated 0s as 0.1, 0.2...). One sample is lost and column names are meaningless. Your transfer notebook's saved output shows exactly this.","recognize":"Column names that look like data, and a row count one less than expected (19999 instead of 20000).","debug":"Check df.columns[:5] and df.shape after every load; compare with the known dataset size.","buggy":"df = pd.read_csv(CSV_PATH)","fixed":"df = pd.read_csv(CSV_PATH, header=None)","iq":"What checks would you add right after loading any dataset?","ia":"Shape against the expected size, column names/dtypes, label value counts (class balance), min/max of features (pixels should be 0-255), nulls, and a few rendered samples with labels.","recon":false},{"id":"rnn-idk","title":"predict() prints IDK and an answer","where":"RNN.ipynb, predict()","kind":"Live in repo","topic":"rnn","err":"IDK\nparis      (both printed for a low-confidence question)","why":"The threshold branch prints IDK but doesn't return or use else, so execution falls through to the answer print. The confidence threshold never suppresses anything.","recognize":"Two outputs where only one should be possible; any if-branch meant to be exclusive that alculate_accuracy uses dataloader1 instead of dataloader. Notebooks keep every variable alive in one namespace, so the code runs and the bug hides until inputs differ.","recon":true},{"id":"lstm-device","title":"Inference input left on the CPU","where":"pytorch_lstm_next_word_predictor.ipynb, prediction()","kind":"Live in repo","topic":"lstm","err":"RuntimeError: Expected all tensors to be on the same device, but found at least two devices, cuda:0 and cpu!","why":"The model was moved with model.to(device), but prediction() builds padded_text on the CPU and passes it straight in. Your saved run was on a Mac where device resolved to CPU, so it worked there. On a CUDA machine the first generation call crashes.","recognize":"Training works (batches are moved) but inference fails on GPU only.","debug":"Print next(model.parameters()).device and the input's .device in the function. Write inference functions that read the device from the model.","buggy":"padded_text = torch.tensor([0] * (61 - len(numerical_text)) + numerical_text, dtype=torch.long).unsqueeze(0)\noutput = model(padded_text)","fixed":"dev = next(model.parameters()).device\npadded_text = torch.tensor([0] * (61 - len(numerical_text)) + numerical_text, dtype=torch.long).unsqueeze(0).to(dev)\noutput = model(padded_text)","iq":"How do you write inference code that works regardless of where the model lives?","ia":"Derive the device from the model (next(model.parameters()).device) or pass it explicitly; move every input with .to(device); bring outputs back with .cpu() before NumPy/printing; and test on both CPU and GPU in CI if possible.","recon":false},{"id":"lstm-train-acc","title":"Accuracy measured on training data via a global loader","where":"pytorch_lstm_next_word_predictor.ipynb, calculate_accuracy()","kind":"Live in repo","topic":"lstm","err":"Model Accuracy: 95.65%      (no exception)","why":"calculate_accuracy takes a dataloader argument but iterates the global dataloader1, and both wrap the same 942 training sequences. 95.65% measures memorisation of the training text, not next-word prediction on unseen text. Padding id 0 is also <unk>, so the model can't distinguish padding from unknown words.","recognize":"High accuracy with no held-out split anywhere in the notebook; an unused function parameter.","debug":"Split lines into train/test before building sequences, evaluate on the held-out lines, and pass the loader explicitly.","buggy":"def calculate_accuracy(model, dataloader, device):\n    ...\n    for batch_x, batch_y in dataloader1:","fixed":"def calculate_accuracy(model, dataloader, device):\n    ...\n    for batch_x, batch_y in dataloader:\n\n# and evaluate on a held-out split:\ncalculate_accuracy(model, test_dataloader, device)","iq":"For a next-word model, why is accuracy a weak metric and what would you use instead?","ia":"Many next words are valid, so exact-match accuracy punishes reasonable predictions and ignores how much probability went to the right word. Perplexity (exp of average cross-entropy on held-out text) is the standard metric; top-k accuracy is a friendlier secondary one.","recon":false}],"compare":[{"id":"nograd","title":"no_grad vs detach vs requires_grad_(False) vs eval()","cols":["","torch.no_grad()","x.detach()","requires_grad_(False)","model.eval()"],"rows":[["What it is","Context manager","Tensor method returning a new tensor","In-place flag on a leaf tensor","Module mode switch"],["Affects","Every op inside the block","One tensor","One parameter, permanently","Dropout and BatchNorm behaviour"],["Stops gradients?","Yes, nothing recorded","Yes, through that tensor","Yes, for that parameter","No"],["Typical use","Evaluation, manual weight updates","Using a value as a constant target","Freezing layers (VGG16 features)","Before evaluation or inference"],["In your code","Pipeline updates, all eval loops","Mentioned in Auto_Grad_Back comments","Transfer learning freeze","Dropout ANN, DataLoader pipeline, LSTM"]]},{"id":"losses","title":"BCEL s, float targets same shape\nnn.CrossEntropyLoss()   # logits (B,C), long targets (B,)\nnn.MSELoss()            # regression"],["Optimisers","optim.SGD(model.parameters(), lr=0.01, momentum=0.9, weight_decay=1e-4)\noptim.Adam(model.parameters(), lr=1e-3)\noptim.AdamW(model.parameters(), lr=1e-3, weight_decay=1e-2)\noptim.RMSprop(model.parameters(), lr=1e-3)"],["Data","class DS(Dataset):\n    def __len__(self): return len(self.X)\n    def __getitem__(self, i): return self.X[i], self.y[i]\nDataLoader(ds, batch_size=32, shuffle=True, pin_memory=True)\nxb, yb = next(iter(loader))   # quick shape check"],["Training loop","model.train()\nfor epoch in range(epochs):\n    total = 0.0\n    for xb, yb in train_loader:\n        xb, yb = xb.to(device), yb.to(device)\n        loss = criterion(model(xb), yb)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n        total += loss.item()\n    print(epoch + 1, total / len(train_loader))"],["Evaluation loop","model.eval()\ncorrect = n = 0\nwith torch.no_grad():\n    for xb, yb in test_loader:\n        xb, yb = xb.to(device), yb.to(device)\n        pred = model(xb).argmax(dim=1)          # binary: (model(xb) > 0.5).view(-1)\n        correct += (pred == yb).sum().item()\n        n += yb.size(0)\nprint(correct / n)"],["Sequences","nn.Embedding(vocab_size, 100, padding_idx=0)\nnn.RNN(100, 64, batch_first=True)     # out, h_n\nnn.LSTM(100, 150, batch_first=True)   # out, (h_n, c_n)\nlogits = fc(h_n.squeeze(0))\nnn.utils.clip_grad_norm_(model.parameters(), 1.0)"],["Transfer learning","from torchvision.models import vgg16, VGG16_Weights\nm = vgg16(weights=VGG16_Weights.DEFAULT)\nfor p in m.features.parameters(): p.requires_grad = False\nm.classifier = nn.Sequential(nn.Linear(25088, 512), nn.ReLU(), nn.Linear(512, 10))\noptim.Adam(m.classifier.parameters(), lr=1e-4)"],["Save and load (not in repo yet)","torch.save(model.state_dict(), 'model.pt')\nmodel.load_state_dict(torch.load('model.pt', map_location=device))\nmodel.eval()"],["Shape debugging","print(x.shape, x.dtype, x.device)\nassert pred.shape == target.shape, (pred.shape, target.shape)\nprint(model)                       # real layer classes\nfrom torchinfo import summary; summary(model, input_size=(1, 784))"]],"gaps":[["Tensor creation, dtypes, reductions, matmul","covered","PyTorch_Basics","basics"],["Device placement and GPU timing","covered","PyTorch_On_GPU","gpu"],["Autograd and the chain rule","covered","Auto_Grad_Back","autograd"],["nn.Module, nn.Linear, nn.Sequential","covered","NN_Module, ANN","nnmodule"],["Dataset and DataLoader","covered","Full pipeline, all MNIST notebooks","dataloader"],["BCELoss and CrossEntropyLoss","covered","Pipelines, MNIST","ann"],["SGD, Adam, RMSprop","covered","Pipelines, Optuna, VGG16","optuna"],["Dropout, BatchNorm, weight decay","covered","Dropout ANN","regularization"],["Hyperparameter search (Optuna)","covered","Optuna ANN","optuna"],["Embeddings, RNN, LSTM","covered","RNN, LSTM","lstm"],["Transfer learning by feature extraction","covered","VGG16","transfer"],["Broadcasting rules","partial","Used implicitly; the cause of the 55% accuracy bug","pipeline_nn"],["train() / eval() mode discipline","partial","Called in some notebooks, missing in VGG16 eval","regularization"],["Train / validation / test splits","partial","Only train/test; Optuna tunes on test","optuna"],["Evaluation metrics beyond accuracy","partial","Accuracy only; no precision/recall/F1/confusion matrix","dataloader"],["Padding and variable-length sequences","partial","Manual left padding; no padding_idx or packing","lstm"],["Fine-tuning (unfreezing pretrained layers)","partial","Only the frozen-base variant","transfer"],["view vs reshape, contiguity, strides","partial","view(-1,1) used; contiguity not explored","basics"],["Convolutional networks from scratch (nn.Conv2d, pooling)","missing","Only used inside pretrained VGG16",null],["Saving and loading models (state_dict, checkpoints)","missing","No torch.save anywhere",null],["Learning-rate schedulers","missing","No lr_scheduler",null],["Early stopping on validation loss","missing","Epochs fixed or searched",null],["BCEWithLogitsLoss and numerical stability","missing","Would fix the nan-loss class of bugs",null],["Weight initialisation (Xavier, Kaiming)","missing","Defaults only; manual rand init caused saturation",null],["Gradient clipping","missing","Important for RNN/LSTM stability",null],["torchvision datasets and data augmentation","missing","MNIST loaded via CSV / OpenML",null],["Class imbalance (weights, sampling)","missing","Breast-cancer data is 63/37",null],["GRU and bidirectional / stacked RNNs","missing","Single-layer unidirectional only",null],["Reproducibility beyond manual_seed (cuda seeds, deterministic)","missing","Only torch.manual_seed",null],["Logging and visualising training (TensorBoard, curves)","missing","Loss printed only",null],["Indexing, gather, masking, einsum","missing","Barely touched",null],["Attention and Transformers","advanced","Natural next step after LSTM",null],["Mixed precision (torch.autocast, GradScaler)","advanced","Faster GPU training",null],["torch.compile","advanced","PyTorch 2.x graph compilation",null],["Distributed training (DDP)","advanced","Multi-GPU",null],["Custom autograd.Function","advanced","Writing your own backward",null],["Hooks (forward/backward)","advanced","torchinfo uses them under the hood",null],["Model export (TorchScript, ONNX) and quantisation","advanced","Deployment",null]]}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);
var TOP = {}, QMAP = {}, CMAP = {}, ALLQ = [], ALLC = [];
D.topics.forEach(function(t, ti){
  t.n = ti + 1;
  TOP[t.id] = t;
  t.quiz.forEach(function(q, i){ var id = t.id + "-q" + i; q.id = id; QMAP[id] = {t: t, q: q}; ALLQ.push(id); });
  t.cards.forEach(function(c, i){ var id = t.id + "-c" + i; CMAP[id] = {t: t, f: c[0], b: c[1], id: id}; ALLC.push(id); });
});

/* ---------- storage ---------- */
var KEY = "ptdash.v1";
var storageOK = false;
try { localStorage.setItem("__pt_test", "1"); localStorage.removeItem("__pt_test"); storageOK = true; } catch (e) { storageOK = false; }
function blank(){ return {q: {}, cards: {}, visited: {}, exams: []}; }
var S = blank();
if (storageOK) {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); if (p && typeof p === "object") { S.q = p.q || {}; S.cards = p.cards || {}; S.visited = p.visited || {}; S.exams = p.exams || []; } }
  } catch (e) { S = blank(); }
}
function save(){ if (!storageOK) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function recordQ(id, ok){
  var r = S.q[id] || {n: 0, c: 0, last: false};
  r.n += 1; if (ok) r.c += 1; r.last = !!ok; r.t = Date.now();
  S.q[id] = r; save();
}
function recordCard(id, r){ S.cards[id] = {r: r, t: Date.now()}; save(); }

/* ---------- scoring ---------- */
var RATEVAL = {again: 0.2, good: 0.75, easy: 1};
function topicStats(t){
  var answered = 0, right = 0, rated = 0, cardSum = 0, missed = [];
  t.quiz.forEach(function(q){ var r = S.q[q.id]; if (r) { answered++; if (r.last) right++; else missed.push(q); } });
  t.cards.forEach(function(c, i){ var r = S.cards[t.id + "-c" + i]; if (r) { rated++; cardSum += RATEVAL[r.r] || 0; } });
  var quiz = right / t.quiz.length, card = cardSum / t.cards.length;
  return {mastery: 0.7 * quiz + 0.3 * card, answered: answered, right: right, rated: rated, missed: missed,
          attempted: answered > 0 || rated > 0, visited: !!S.visited[t.id],
          again: t.cards.filter(function(c, i){ var r = S.cards[t.id + "-c" + i]; return r && r.r === "again"; }).length};
}
function readiness(){
  var s = 0; D.topics.forEach(function(t){ s += topicStats(t).mastery; });
  return Math.round(100 * s / D.topics.length);
}
function pct(x){ return Math.round(x * 100); }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
var TICK = new RegExp("\\x60([^\\x60]+)\\x60", "g");
function md(s){ return esc(s).replace(TICK, "<code>$1</code>"); }
var KW = {"False":1,"None":1,"True":1,"and":1,"as":1,"assert":1,"break":1,"class":1,"continue":1,"def":1,"del":1,"elif":1,"else":1,"except":1,"for":1,"from":1,"if":1,"import":1,"in":1,"is":1,"lambda":1,"not":1,"or":1,"pass":1,"raise":1,"return":1,"try":1,"while":1,"with":1,"yield":1};
var MODS = {"torch":1,"nn":1,"optim":1,"np":1,"pd":1,"self":1,"F":1,"optuna":1,"transforms":1,"models":1,"plt":1,"time":1,"os":1,"nltk":1};
var TOKRE = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|[rRbBfFuU]{0,2}"(?:\\.|[^"\\\n])*"|[rRbBfFuU]{0,2}'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d*)?(?:[eE]-?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
function hl(code){
  var out = "", last = 0, m;
  TOKRE.lastIndex = 0;
  while ((m = TOKRE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    var tok = m[0], cls = "";
    if (m[1]) cls = "co";
    else if (m[2]) cls = "st";
    else if (m[3]) cls = "nu";
    else if (m[4]) {
      if (KW[tok]) cls = "kw";
      else if (MODS[tok]) cls = "mo";
      else if (code.charAt(TOKRE.lastIndex) === "(") cls = "fn";
    }
    out += cls ? ('<span class="' + cls + '">' + esc(tok) + "</span>") : esc(tok);
    last = TOKRE.lastIndex;
  }
  return out + esc(code.slice(last));
}
function codeBlock(code, cls){ return '<pre class="code' + (cls ? " " + cls : "") + '"><code>' + hl(code) + "</code></pre>"; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = a[i]; a[i] = a[j]; a[j] = tmp; } return a; }
function $(id){ return document.getElementById(id); }
var page = $("page");

/* ---------- sidebar ---------- */
function navLink(href, label, extra){ return '<a href="' + href + '" data-href="' + href + '">' + (extra || "") + '<span class="lbl">' + esc(label) + "</span></a>"; }
function buildSide(){
  var h = '<div class="brand"><b>PyTorch learning dashboard</b><span>setia08/PyTorch-Code, 13 topics</span></div><div class="nav">';
  h += '<div class="navgroup">Overview</div>' + navLink("#/dashboard", "Dashboard") + navLink("#/roadmap", "Roadmap");
  h += '<div class="navgroup">Topics</div>';
  D.order.forEach(function(id){
    var t = TOP[id];
    h += '<a href="#/topic/' + id + '" data-href="#/topic/' + id + '"><span class="num">' + t.n + '</span><span class="lbl">' + esc(t.title) + '</span><span class="mini" aria-hidden="true"><i data-mini="' + id + '"></i></span></a>';
  });
  h += '<div class="navgroup">Practice</div>' + navLink("#/flashcards", "Flashcards") + navLink("#/exam", "Exam mode");
  h += '<div class="navgroup">Reference</div>' + navLink("#/debug", "Debugging handbook") + navLink("#/compare", "Compare concepts") + navLink("#/cheatsheet", "Cheatsheet") + navLink("#/gaps", "Coverage gaps");
  h += "</div>";
  $("side").innerHTML = h;
  updateSide();
}
function updateSide(){
  var els = document.querySelectorAll("[data-mini]");
  for (var i = 0; i < els.length; i++) { els[i].style.width = pct(topicStats(TOP[els[i].getAttribute("data-mini")]).mastery) + "%"; }
}
function setActive(hash){
  var links = document.querySelectorAll(".nav a");
  for (var i = 0; i < links.length; i++) {
    var on = links[i].getAttribute("data-href") === hash;
    links[i].classList.toggle("active", on);
    if (on) links[i].setAttribute("aria-current", "page"); else links[i].removeAttribute("aria-current");
  }
}
function openNav(open){
  document.body.classList.toggle("nav-open", open);
  $("burger").setAttribute("aria-expanded", open ? "true" : "false");
}
$("burger").addEventListener("click", function(){ openNav(!document.body.classList.contains("nav-open")); });
$("overlay").addEventListener("click", function(){ openNav(false); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") openNav(false); });

/* ---------- dashboard ---------- */
function nextRecommendation(){
  for (var i = 0; i < D.order.length; i++) {
    var t = TOP[D.order[i]], s = topicStats(t);
    if (s.mastery < 0.8) {
      var why;
      if (!s.visited && !s.attempted) why = "You haven't opened this one yet. It's next in the roadmap order.";
      else if (s.answered < t.quiz.length) why = "You've started it. Finish the quiz: " + s.answered + " of " + t.quiz.length + " questions answered.";
      else if (s.missed.length) why = "You missed " + s.missed.length + " quiz question" + (s.missed.length > 1 ? "s" : "") + " here. Re-read the breakdown, then retry the quiz.";
      else why = "Quiz done. Rate its flashcards to lock it in.";
      var pre = D.edges.filter(function(e){ return e.to === t.id; }).map(function(e){ return TOP[e.from]; });
      return {t: t, why: why, pre: pre};
    }
  }
  return null;
}
function renderDashboard(){
  var r = readiness(), answered = 0, right = 0, rated = 0;
  Object.keys(S.q).forEach(function(k){ answered += S.q[k].n; right += S.q[k].c; });
  rated = Object.keys(S.cards).length;
  var h = "<h1>Interview readiness</h1>";
  if (!storageOK) h += '<div class="notice">This browser is blocking local storage (private mode or a file preview), so progress lasts only until you close the page.</div>';
  h += '<div class="hero"><div class="score">' + r + '<sup>%</sup></div><div><div class="strip" role="img" aria-label="Mastery per topic">';
  D.order.forEach(function(id){ var m = pct(topicStats(TOP[id]).mastery); h += '<a href="#/topic/' + id + '" title="' + esc(TOP[id].title) + ": " + m + '%"><i style="height:' + m + '%"></i></a>'; });
  h += '</div><div class="strip-cap"><span>1 Tensor basics</span><span>13 LSTM</span></div></div></div>';
  h += '<p class="muted small">Readiness = average topic mastery. Mastery = 70% latest quiz results + 30% flashcard ratings (Again 0.2, Good 0.75, Easy 1). Exam answers count toward quizzes.</p>';
  h += '<div class="stats"><div><b>' + answered + '</b><span>quiz answers</span></div><div><b>' + (answered ? pct(right / answered) + "%" : "–") + '</b><span>answer accuracy</span></div><div><b>' + rated + " / " + ALLC.length + '</b><span>cards rated</span></div></div>';
  var nx = nextRecommendation();
  if (nx) {
    h += '<div class="next"><div class="muted small">Continue learning</div><h3>' + nx.t.n + ". " + esc(nx.t.title) + "</h3><p>" + esc(nx.why) + "</p>";
    if (nx.pre.length) h += '<p class="small muted">Builds on: ' + nx.pre.map(function(p){ return '<a href="#/topic/' + p.id + '">' + esc(p.title) + "</a> (" + pct(topicStats(p).mastery) + "%)"; }).join(", ") + "</p>";
    h += '<div class="btnrow"><a class="btn primary" href="#/topic/' + nx.t.id + '">Open topic</a><a class="btn" href="#/topic/' + nx.t.id + '/quiz">Go to its quiz</a></div></div>';
  } else {
    h += '<div class="next"><h3>Every topic is at 80% or higher</h3><p>Run Exam mode to keep it fresh, or work through the coverage gaps.</p><div class="btnrow"><a class="btn primary" href="#/exam">Start an exam</a><a class="btn" href="#/gaps">See coverage gaps</a></div></div>';
  }
  h += "<h2>Weak areas</h2>";
  var weak = D.topics.map(function(t){ return {t: t, s: topicStats(t)}; }).filter(function(x){ return x.s.attempted && (x.s.mastery < 0.6 || x.s.missed.length || x.s.again); });
  weak.sort(function(a, b){ return a.s.mastery - b.s.mastery; });
  if (!weak.length) {
    var any = D.topics.some(function(t){ return topicStats(t).attempted; });
    h += '<p class="muted">' + (any ? "Nothing flagged. Every topic you've attempted has no missed questions and no cards marked Again." : "No data yet. Answer a topic quiz or rate some flashcards and weak areas will show up here.") + "</p>";
  } else {
    h += '<ul class="clean weak">';
    weak.slice(0, 6).forEach(function(x){
      var bits = [];
      if (x.s.missed.length) bits.push(x.s.missed.length + " missed question" + (x.s.missed.length > 1 ? "s" : ""));
      if (x.s.again) bits.push(x.s.again + " card" + (x.s.again > 1 ? "s" : "") + " marked Again");
      if (x.s.answered < x.t.quiz.length) bits.push((x.t.quiz.length - x.s.answered) + " unanswered");
      h += '<li class="panel"><a href="#/topic/' + x.t.id + '"><b>' + esc(x.t.title) + "</b></a> <span class=\"muted small\">" + pct(x.s.mastery) + "% mastery</span><div class=\"small\">" + esc(bits.join(", ")) + "</div>";
      if (x.s.missed.length) h += '<div class="small muted">Missed: ' + x.s.missed.map(function(q){ return esc(q.q); }).join(" / ") + "</div>";
      h += "</li>";
    });
    h += "</ul>";
  }
  h += "<h2>Progress by topic</h2><div class=\"prog\">";
  D.order.forEach(function(id){
    var t = TOP[id], s = topicStats(t), m = pct(s.mastery);
    h += '<a class="prow" href="#/topic/' + id + '"><span class="n">' + t.n + "</span><span>" + esc(t.title) + '</span><span class="bar"><i style="width:' + m + '%"></i></span><span class="p">' + m + "%</span></a>";
  });
  h += "</div>";
  if (S.exams.length) {

/* ---------- roadmap ---------- */
function graphSVG(){
  var W = 640, NW = 176, NH = 58, RH = 92, top = 14, cols = [100, 320, 540];
  var rows = 0; Object.keys(D.layout).forEach(function(k){ rows = Math.max(rows, D.layout[k][1]); });
  var H = top * 2 + rows * RH + NH;
  function pos(id){ var l = D.layout[id]; return {x: cols[l[0]], y: top + l[1] * RH}; }
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Dependency graph of the 13 notebooks"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>';
  D.edges.forEach(function(e){
    var a = pos(e.from), b = pos(e.to), y1 = a.y + NH, y2 = b.y - 2;
    var d;
    if (a.x === b.x) d = "M" + a.x + "," + y1 + " L" + b.x + "," + y2;
    else { var cy = (y2 - y1) * 0.5; d = "M" + a.x + "," + y1 + " C" + a.x + "," + (y1 + cy) + " " + b.x + "," + (y2 - cy) + " " + b.x + "," + y2; }
    s += '<path class="edge" d="' + d + '" marker-end="url(#arr)"><title>' + esc(TOP[e.from].title + " -> " + TOP[e.to].title + ": " + e.why) + "</title></path>";
  });
  D.order.forEach(function(id){
    var t = TOP[id], p = pos(id), m = topicStats(t).mastery, x = p.x - NW / 2;
    s += '<a class="node" href="#/topic/' + id + '" tabindex="0"><rect class="box" x="' + x + '" y="' + p.y + '" width="' + NW + '" height="' + NH + '" rx="10"/>';
    s += '<text x="' + (x + 12) + '" y="' + (p.y + 23) + '" font-size="14" font-weight="600">' + t.n + ". " + esc(t.short) + "</text>";
    s += '<text class="sub" x="' + (x + 12) + '" y="' + (p.y + 40) + '" font-size="12">' + esc(t.sub) + "</text>";
    s += '<rect class="trk" x="' + (x + 12) + '" y="' + (p.y + NH - 10) + '" width="' + (NW - 24) + '" height="4" rx="2"/>';
    s += '<rect class="fil" x="' + (x + 12) + '" y="' + (p.y + NH - 10) + '" width="' + Math.max(0, (NW - 24) * m) + '" height="4" rx="2"/></a>';
  });
  return s + "</svg>";
}
function renderRoadmap(){
  var h = '<h1>Roadmap</h1><p class="lede">How the 13 notebooks build on each other. Arrows point from a prerequisite to the notebook that reuses it; the bar under each node is your mastery. Tap a node to open it.</p>';
  h += '<div class="graph">' + graphSVG() + '</div><p class="graph-hint small muted">Swipe the graph sideways to see all three columns.</p>';
  h += "<h2>Dependency map</h2>";
  D.order.forEach(function(id){
    var t = TOP[id];
    var pre = D.edges.filter(function(e){ return e.to === id; });
    var post = D.edges.filter(function(e){ return e.from === id; });
    h += '<div class="dep"><h3><a href="#/topic/' + id + '">' + t.n + ". " + esc(t.title) + '</a></h3><div class="small muted" style="font-family:var(--mono);word-break:break-all">' + esc(t.nb) + "</div>";
    h += "<p>" + md(t.concept) + "</p>";
    h += '<div class="chips">' + t.apis.map(function(a){ return '<span class="chip">' + esc(a) + "</span>"; }).join("") + "</div>";
    if (pre.length) h += '<div class="builds"><b>Builds on</b>' + pre.map(function(e){ return "<div><a href=\"#/topic/" + e.from + "\">" + esc(TOP[e.from].title) + "</a>: " + esc(e.why) + "</div>"; }).join("") + "</div>";
    else h += '<div class="builds"><b>Builds on</b><div class="muted">Nothing; start here.</div></div>';
    if (post.length) h += '<div class="builds"><b>Leads to</b> ' + post.map(function(e){ return '<a href="#/topic/' + e.to + '">' + esc(TOP[e.to].title) + "</a>"; }).join(", ") + "</div>";
    h += "</div>";
  });
  page.innerHTML = h;
}

function restoreQuizState(root){

  h += '<div class="seg" role="group" aria-label="Filter"><button data-act="gapf" data-v="all" aria-pressed="' + (GAPF === "all") + '">All (' + D.gaps.length + ")</button>";
  ["covered", "partial", "missing", "advanced"].forEach(function(k){ h += '<button data-act="gapf" data-v="' + k + '" aria-pressed="' + (GAPF === k) + '">' + k.charAt(0).toUpperCase() + k.slice(1) + " (" + counts[k] + ")</button>"; });
  h += '</div><div class="tablewrap"><table><thead><tr><th>Concept</th><th>Status</th><th>In your repo</th></tr></thead><tbody>';
  D.gaps.forEach(function(g){
    if (GAPF !== "all" && g[1] !== GAPF) return;
    h += '<tr class="gaprow"><td>' + md(g[0]) + '</td><td><span class="tag ' + g[1] + '">' + g[1] + "</span></td><td>" + md(g[2]) + (g[3] ? ' <a class="small" href="#/topic/' + g[3] + '">' + esc(TOP[g[3]].title) + "</a>" : "") + "</td></tr>";
  });
  h += "</tbody></table></div>";
  page.innerHTML = h;
}

function renderNotFound(){ page.innerHTML = '<h1>Page not found</h1><p>That link doesn\'t match any page. <a href="#/dashboard">Go to the dashboard</a>.</p>'; }

/* ---------- click handling ---------- */
document.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  var jump = e.target.closest ? e.target.closest("[data-jump]") : null;
  if (jump) { e.preventDefault(); var k = jump.getAttribute("data-jump"); history.replaceState(null, "", jump.getAttribute("href")); jumpTo(k); return; }
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "answer") {
    var box = el.closest(".qz"); if (box.classList.contains("done")) return;
    var qid = el.getAttribute("data-qid"), i = +el.getAttribute("data-i"), q = QMAP[qid].q;
    recordQ(qid, i === q.a); S.q[qid].sel = i; save();
    showAnswer(box, q, i, true); updateSide();
  } else if (act === "retry") {
    var bx = el.closest(".qz"); bx.classList.remove("done");
    var bs = bx.querySelectorAll(".opt"); for (var k = 0; k < bs.length; k++) { bs[k].classList.remove("ok", "no"); bs[k].removeAttribute("aria-disabled"); }
    bx.querySelector(".fbwrap").innerHTML = "";
    if (S.q[el.getAttribute("data-qid")]) { delete S.q[el.getAttribute("data-qid")].sel; save(); }
    bs[0].focus();
  } else if (act === "flip") {
    flip(el);
  } else if (act === "rate") {
    var cid = el.getAttribute("data-cid"), r = el.getAttribute("data-r");
    recordCard(cid, r); updateSide();
    var grp = el.parentNode.querySelectorAll("button"); for (var j = 0; j < grp.length; j++) grp[j].setAttribute("aria-pressed", grp[j] === el ? "true" : "false");
    if (FL && el.closest("#flashzone")) {
      FL.tally[r]++;
      if (r === "again") { var cur = FL.deck[FL.i]; FL.deck.splice(Math.min(FL.i + 4, FL.deck.length), 0, cur); }
      FL.i++; drawFlash();
      var sb = page.querySelectorAll('[data-act="deck"]'); if (sb.length > 1) { sb[1].textContent = "Marked Again (" + ALLC.filter(function(id){ return S.cards[id] && S.cards[id].r === "again"; }).length + ")"; sb[2].textContent = "Not rated yet (" + ALLC.filter(function(id){ return !S.cards[id]; }).length + ")"; }
    }
  } else if (act === "deck") {
    startDeck(el.getAttribute("data-v"));
  } else if (act === "exstart") {
    EX = {qs: shuffle(ALLQ).slice(0, 10), i: 0, ans: []}; renderExam(); window.scrollTo(0, 0);
  } else if (act === "exsel") {
    EX.ans[EX.i] = +el.getAttribute("data-i"); selectExam(EX.ans[EX.i]);
  } else if (act === "exnext") {
    if (EX.ans[EX.i] == null) return;
    EX.i++;
    if (EX.i >= EX.qs.length) {
      var sc = 0;
      EX.qs.forEach(function(id, n){ var ok = EX.ans[n] === QMAP[id].q.a; if (ok) sc++; recordQ(id, ok); S.q[id].sel = EX.ans[n]; });
      S.exams.push({s: sc, n: EX.qs.length, t: Date.now()}); if (S.exams.length > 30) S.exams.shift(); save(); updateSide();
    }
    renderExam(); window.scrollTo(0, 0);
  } else if (act === "exquit") {
    EX = null; renderExam();
  } else if (act === "dbgf") { DBGF = el.getAttribute("data-v"); renderDebug(); }
  else if (act === "cmp") { CMPSEL = el.getAttribute("data-v"); renderCompare(); }
  else if (act === "gapf") { GAPF = el.getAttribute("data-v"); renderGaps(); }
  else if (act === "reset") {
    if (window.confirm("Delete all quiz answers, flashcard ratings and exam history stored in this browser?")) { S = blank(); save(); FL = null; EX = null; updateSide(); renderDashboard(); }
  }
});
function flip(inner){
  var fc = inner.closest(".fc"); fc.classList.toggle("flip");
  var r = fc.querySelector(".rate"); if (r && fc.classList.contains("flip")) r.hidden = false;
}
document.addEventListener("keydown", function(e){
  var t = e.target;
  if (t && t.getAttribute && t.getAttribute("data-act") === "flip" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); flip(t); return; }
  if (location.hash.indexOf("#/flashcards") === 0 && e.key === " " && !(t && /INPUT|TEXTAREA|BUTTON/.test(t.tagName))) {
    var c = document.querySelector("#flashzone [data-act=flip]"); if (c) { e.preventDefault(); flip(c); }
  }
});

/* ---------- router ---------- */
var TITLES = {dashboard: "Dashboard", roadmap: "Roadmap", flashcards: "Flashcards", exam: "Exam mode", debug: "Debugging handbook", compare: "Compare concepts", cheatsheet: "Cheatsheet", gaps: "Coverage gaps"};
var lastRoute = "";
function route(){
  var hash = location.hash || "#/dashboard";
  var parts = hash.replace(/^#\/?/, "").split("/");
  var name = parts[0] || "dashboard", base = "#/" + name;
  var routeKey = name === "topic" ? "topic/" + parts[1] : name;
  if (name === "topic" && routeKey === lastRoute && parts[2]) { jumpTo(parts[2]); openNav(false); return; }
  lastRoute = routeKey;
  openNav(false);
  var title = TITLES[name];
  if (name === "topic") { base = "#/topic/" + parts[1]; renderTopic(parts[1], parts[2]); title = TOP[parts[1]] ? TOP[parts[1]].title : "Not found"; }
  else if (name === "dashboard") renderDashboard();
  else if (name === "roadmap") renderRoadmap();
  else if (name === "flashcards") renderFlash();
  else if (name === "exam") renderExam();
  else if (name === "debug") renderDebug();
  else if (name === "compare") renderCompare();
  else if (name === "cheatsheet") renderCheat();
  else if (name === "gaps") renderGaps();
  else { renderNotFound(); title = "Not found"; }
  setActive(base);
  $("toptitle").textContent = title || "PyTorch learning dashboard";
  document.title = (title ? title + " | " : "") + "PyTorch learning dashboard";
  if (!(name === "topic" && parts[2])) window.scrollTo(0, 0);
}
buildSide();
window.addEventListener("hashchange", route);
route();
})();
</script>
