<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PyTorch learning dashboard</title>
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface2:#E9EEF2; --ink:#17212B; --muted:#566373; --line:#D3DBE3;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D5EEEC;
  --good:#2C7A4B; --good-soft:#DDF1E4; --bad:#B42318; --bad-soft:#FBE4E1; --warn:#9A6200; --warn-soft:#FBEFD6; --adv:#5B45A8; --adv-soft:#E8E3F7;
  --code-bg:#F6F8FA; --code-ink:#1F2933; --c-kw:#8A2BB0; --c-str:#2E7D32; --c-num:#B35A00; --c-com:#6B7785; --c-fn:#0B5CAD; --c-mod:#0B7A75;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --side:272px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1318; --surface:#151C24; --surface2:#1C2530; --ink:#E2E8EE; --muted:#94A2B1; --line:#2A3542;
    --accent:#3CC0B6; --accent-ink:#06201E; --accent-soft:#16332F;
    --good:#5CC98A; --good-soft:#163323; --bad:#FF8A7A; --bad-soft:#3A1C19; --warn:#E3B04B; --warn-soft:#352A12; --adv:#B3A3F0; --adv-soft:#2A2440;
    --code-bg:#10161D; --code-ink:#D7DEE5; --c-kw:#D19CF0; --c-str:#9AD58F; --c-num:#F2B36B; --c-com:#7D8A98; --c-fn:#7FB8F5; --c-mod:#5FD3C8;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.88em;background:var(--surface2);padding:.08em .32em;border-radius:4px;word-break:break-word}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:2rem;letter-spacing:-.01em}
h2{font-size:1.35rem;margin-top:2.4rem;margin-bottom:.7rem}
h3{font-size:1.08rem;font-family:var(--sans);font-weight:650}
p{margin:.5rem 0}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* layout */
.topbar{display:none}
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px calc(24px + env(safe-area-inset-bottom,0px));z-index:30;-webkit-overflow-scrolling:touch}
.brand{padding:4px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand b{font-family:var(--serif);font-size:1.2rem;display:block}
.brand span{font-size:.8rem;color:var(--muted)}
.navgroup{margin:14px 0 4px;padding:0 10px;font-size:.78rem;color:var(--muted);font-weight:600}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:.93rem;min-height:36px}
.nav a:hover{background:var(--surface2)}
.nav a.active{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;width:1.4em;text-align:right;flex:none}
.nav .lbl{flex:1;min-width:0}
.nav .mini{width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.nav .mini i{display:block;height:100%;background:var(--accent);width:0}
.main{margin-left:var(--side);min-height:100vh}
.page{max-width:900px;margin:0 auto;padding:36px 32px 80px;overflow-wrap:break-word}
.overlay{display:none}
@media (max-width: 900px){
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
  .topbar .t{font-family:var(--serif);font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .burger{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
  .burger span,.burger span:before,.burger span:after{display:block;width:18px;height:2px;background:var(--ink);border-radius:1px;position:relative}
  .burger span:before,.burger span:after{content:"";position:absolute;left:0}
  .burger span:before{top:-6px}.burger span:after{top:6px}
  .side{transform:translateX(-100%);transition:transform .22s ease;width:min(300px,86vw);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  body.nav-open .overlay{display:block;position:fixed;inset:0;z-index:25}
  .main{margin-left:0}
  .page{padding:22px 16px 72px}
  h1{font-size:1.6rem}
}

/* shared components */
.lede{font-size:1.06rem;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel + .panel{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:.6rem 0}
.chip{font-family:var(--mono);font-size:.78rem;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.covered,.tag.easy,.tag.live{background:var(--good-soft);color:var(--good)}
.tag.partial,.tag.medium{background:var(--warn-soft);color:var(--warn)}
.tag.missing,.tag.hard,.tag.bug{background:var(--bad-soft);color:var(--bad)}
.tag.advanced,.tag.hist{background:var(--adv-soft);color:var(--adv)}
.tag.live{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:5px 12px;font-size:.88rem}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.seg button{min-height:36px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.notice{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:.92rem}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.disclose{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:10px 0}
.disclose>summary{padding:14px 16px;display:flex;gap:10px;align-items:flex-start;min-height:44px}
.disclose>summary:before{content:"";flex:none;width:8px;height:8px;margin-top:.5em;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.disclose[open]>summary:before{transform:rotate(45deg)}
.disclose .body{padding:0 16px 16px}
.kv{margin:.7rem 0}
.kv b{display:block;font-size:.84rem;color:var(--muted);font-weight:600;margin-bottom:2px}

/* code */
pre.code{margin:.6rem 0;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.84rem;line-height:1.55;-webkit-overflow-scrolling:touch;tab-size:4}
pre code,.line pre code{background:none;padding:0;border-radius:0;font-size:inherit;word-break:normal}
pre.code .kw{color:var(--c-kw)} pre.code .st{color:var(--c-str)} pre.code .nu{color:var(--c-num)} pre.code .co{color:var(--c-com);font-style:italic} pre.code .fn{color:var(--c-fn)} pre.code .mo{color:var(--c-mod)}
pre.code.plain{white-space:pre-wrap}
.codehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;font-size:.82rem;color:var(--muted);margin-top:.8rem}
.codehead span{min-width:0;overflow-wrap:anywhere}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:.6rem 0}
.vs>div{min-width:0}
.vs .lab{font-size:.82rem;font-weight:700;margin-bottom:-2px}
.vs .lab.w{color:var(--bad)} .vs .lab.r{color:var(--good)}
.vs .w pre.code{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.vs .r pre.code{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
@media (max-width:700px){.vs{grid-template-columns:1fr}}

/* topic page */
.topic-head .file{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin-top:.4rem;word-break:break-all}
.toc{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;margin:16px 0 0;position:sticky;top:0;background:var(--bg);z-index:5;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;font-size:.82rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);white-space:nowrap}
@media (max-width:900px){.toc{top:calc(61px + env(safe-area-inset-top,0px))}}
section.blk{scroll-margin-top:70px}
@media (max-width:900px){section.blk{scroll-margin-top:130px}}
.mental{font-family:var(--serif);font-size:1.12rem;line-height:1.6;border-left:3px solid var(--accent);padding:4px 0 4px 16px;margin:.4rem 0;max-width:68ch}
.lines{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.line{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line pre{margin:0;padding:10px 12px;background:var(--code-bg);font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;word-break:break-word;color:var(--code-ink)}
.line div{padding:10px 12px;font-size:.92rem}
@media (max-width:700px){.line{grid-template-columns:1fr}}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin:.6rem 0}
.flow .st{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:120px;flex:1 1 120px;max-width:200px}
.flow .st b{display:block;font-size:.9rem}
.flow .st span{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.flow .ar{flex:none;width:22px;display:flex;align-items:center;justify-content:center}
.flow .ar:before{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:8px solid var(--accent)}
.flow .st:first-child{border-color:var(--accent)}
@media (max-width:700px){
  .flow{flex-direction:column}
  .flow .st{max-width:none}
  .flow .ar{width:auto;height:20px}
  .flow .ar:before{border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--accent);border-bottom:0}
}
.mistake{margin:1rem 0 1.4rem}
.mistake p{margin:.3rem 0}
.qz{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;margin:12px 0}
.qz .qt{font-weight:600;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;min-height:44px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;white-space:pre-wrap;font-size:.95rem}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.qz.done .opt{cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:.93rem}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{display:block}
.iq summary .q{flex:1;font-weight:600}
.iq .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.summary{font-family:var(--serif);font-size:1.08rem;line-height:1.65;background:var(--accent-soft);border-radius:12px;padding:18px 20px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:3rem;border-top:1px solid var(--line);padding-top:18px}
.pager a{text-decoration:none;max-width:48%}
.pager small{display:block;color:var(--muted)}

/* flashcards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:12px}
.cards>*{min-width:0}
.fc{perspective:1200px;-webkit-perspective:1200px}
.fc .in{display:grid;transition:transform .45s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;cursor:pointer;min-height:150px}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;justify-content:center}
.fc .back{transform:rotateY(180deg);background:var(--accent-soft)}
.fc .face{overflow-wrap:anywhere}
.fc .face small{color:var(--muted);font-size:.75rem;margin-bottom:6px}
.fc .face p{margin:0}
.fc.big .in{min-height:260px}
.fc.big .face{padding:28px;font-size:1.15rem}
.fc.big .front p{font-family:var(--serif);font-size:1.35rem;line-height:1.35}
.rate{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rate button{flex:1;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.rate button.again{color:var(--bad)} .rate button.good{color:var(--ink)} .rate button.easy{color:var(--good)}
.rate button[aria-pressed="true"]{border-color:currentColor;background:var(--surface2)}
.rate[hidden]{display:none}

/* dashboard */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:end;margin:18px 0 8px}
.score{font-family:var(--serif);font-size:4.6rem;line-height:.9;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.score sup{font-size:1.6rem;vertical-align:top;margin-left:2px;letter-spacing:0}
.strip{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;height:54px;align-items:end}
.strip a{display:block;height:100%;background:var(--surface2);border-radius:3px;position:relative;overflow:hidden}
.strip a i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.strip-cap{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:6px}
@media (max-width:560px){.hero{grid-template-columns:1fr;gap:12px}.score{font-size:3.8rem}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stats b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr 1fr}.stats b{font-size:1.1rem}}
.next{border:2px solid var(--accent);border-radius:14px;padding:18px 20px;background:var(--surface);margin:16px 0}
.next h3{font-family:var(--serif);font-size:1.25rem;font-weight:600;margin:2px 0 6px}
.prog{display:grid;gap:2px}
.prow{display:grid;grid-template-columns:1.6em minmax(0,1fr) 120px 3.2em;gap:10px;align-items:center;padding:8px 6px;border-radius:8px;text-decoration:none;color:var(--ink)}
.prow:hover{background:var(--surface2)}
.prow .n{color:var(--muted);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
.prow .p{text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
@media (max-width:560px){.prow{grid-template-columns:1.4em minmax(0,1fr) 70px 2.8em;gap:8px}}
.weak li{margin:.4rem 0}
ul.clean{list-style:none;padding:0;margin:0}

/* roadmap */
.graph{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin:14px 0}
.graph{overflow-x:auto;-webkit-overflow-scrolling:touch}
.graph svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
@media (max-width:600px){.graph svg{min-width:560px}}
.graph-hint{display:none}
@media (max-width:600px){.graph-hint{display:block}}
.graph .node rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.graph .node:hover rect.box,.graph .node:focus rect.box{stroke:var(--accent)}
.graph .node text{fill:var(--ink);font-family:var(--sans)}
.graph .node .sub{fill:var(--muted)}
.graph .node rect.trk{fill:var(--surface2)}
.graph .node rect.fil{fill:var(--accent)}
.graph path.edge{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.7}
.graph marker path{fill:var(--muted)}
.dep{border-top:1px solid var(--line);padding:16px 0}
.dep h3{font-family:var(--serif);font-size:1.12rem;font-weight:600}
.dep h3 a{color:var(--ink);text-decoration:none}
.dep .builds{font-size:.92rem;margin-top:6px}

/* tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-top:1px solid var(--line)}
thead th{border-top:0;background:var(--surface2);font-weight:650;white-space:nowrap}
tbody th{font-weight:600;color:var(--muted);white-space:nowrap}
.cmp td{min-width:150px}
.gaprow td:first-child{font-weight:600}

/* exam */
.exprog{display:flex;gap:4px;margin:14px 0}
.exprog i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.exprog i.d{background:var(--accent)}
.exprog i.c{background:var(--ink)}
.result{font-family:var(--serif);font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums}
.search{width:100%;min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.bugmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.bugmeta .where{font-family:var(--mono);font-size:.76rem;color:var(--muted);word-break:break-word}
pre.err{background:var(--bad-soft);color:var(--ink);border:0;border-left:3px solid var(--bad);border-radius:0 8px 8px 0;white-space:pre-wrap}

@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<noscript><div style="padding:24px;font-family:sans-serif">This dashboard needs JavaScript. If you opened it in a file preview (for example the iPhone Files app), open it in Safari or another browser instead.</div></noscript>
<header class="topbar">
  <button class="burger" id="burger" aria-label="Open menu" aria-controls="side" aria-expanded="false"><span></span></button>
  <div class="t" id="toptitle">PyTorch learning dashboard</div>
</header>
<div class="overlay" id="overlay"></div>

<script type="application/json" id="data">{"topics":[{"id":"basics","title":"Tensor basics","nb":"PyTorch_Basics.ipynb","concept":"Creating tensors, shapes, dtypes, element-wise vs reduction vs matrix ops, in-place ops, cloning","apis":["torch.empty","torch.zeros","torch.rand","torch.manual_seed","torch.tensor","torch.arange","torch.linspace","torch.eye","torch.full","reshape","*_like","dtype / .to()","torch.sum(dim)","torch.matmul","torch.dot","torch.softmax","add_ / relu_","clone"],"what":"A tensor is PyTorch's n-dimensional array: a block of numbers with a `shape`, a `dtype` and a `device`. Every input, weight, gradient and output in every later notebook is a tensor, so this notebook is the alphabet for everything else.","why":"Neural networks are just chains of tensor operations. If you can't predict the shape and dtype that comes out of `torch.sum(e, axis=0)` or `torch.matmul(f, g)`, you can't debug a model. The shape bugs in your later notebooks (the 55% accuracy one in particular) are basics bugs wearing a training-loop costume.","mental":"Think of a tensor as a spreadsheet that can have more than two axes. `shape` tells you how many rows/columns/pages. Element-wise ops work cell by cell, reductions collapse an axis (sum along dim 0 squashes the rows into one row), and matmul is the row-times-column dance from linear algebra.","syntax":"x = torch.tensor([[1, 2, 3], [4, 5, 6]])   # from data\nz = torch.zeros(2, 3)                      # filled\nr = torch.rand(2, 3)                       # uniform [0, 1)\nx.shape, x.dtype                           # torch.Size([2, 3]), torch.int64\nx.reshape(3, 2)                            # same data, new shape\nx.to(torch.float32)                        # new dtype (returns a copy)\ntorch.sum(x, dim=0)                        # collapse rows -> shape [3]\ntorch.matmul(a, b)                         # (n,k) @ (k,m) -> (n,m)\nx.add_(1)                                  # trailing _ = in-place\ny = x.clone()                              # independent copy","lines":[["tensor=torch.empty(2,3)","Allocates a 2x3 block without initialising it, so you see whatever bytes were already in memory. Fast, but never read it before writing."],["torch.manual_seed(100)","Seeds the global RNG so the next torch.rand call produces the same numbers every run. Reproducibility starts here."],["torch.arange(0,10,2) #for loop types","Like Python's range: start 0, stop 10 (exclusive), step 2 -> [0, 2, 4, 6, 8]."],["torch.linspace(0,10,20)","20 evenly spaced points from 0 to 10 inclusive. Use when you care about the count, not the step."],["x.reshape(1,1,6)","Same 6 numbers viewed as a 1x1x6 tensor. Total element count must stay the same."],["x.to(torch.float32)","Returns a float copy. x itself is still int64 because the result isn't assigned back."],["e=torch.randint(size=(2,3),low=0,high=10,dtype=torch.float32)","Random integers 0-9 stored as floats. Floats are needed for mean/std later."],["torch.sum(e,axis=0)","Sums down each column, collapsing dim 0: shape [2,3] -> [3]."],["torch.matmul(f,g)","(2,3) @ (3,2) -> (2,2). The inner dims (3 and 3) must match."],["torch.softmax(k,dim=0)","Turns each column into probabilities that sum to 1 along dim 0."],["m.add_(n)","In-place add: m is overwritten. The trailing underscore is the in-place convention."],["b=a.clone()","b gets its own memory. Writing a[0]=0 afterwards leaves b untouched, as your notebook's output shows."]],"internals":"A tensor is a thin header (shape, strides, dtype, device, offset) pointing at a flat storage buffer. `reshape` usually just writes new strides over the same storage, which is why it's cheap; `clone` allocates new storage and copies. In-place ops (`add_`) mutate storage directly and bump a version counter that autograd later checks. Reductions run a kernel that walks the chosen dimension using its stride, and `matmul` dispatches to an optimised BLAS routine on CPU.","flow":[["Python data","list / number"],["torch.tensor()","storage + shape + dtype"],["reshape / to()","new view or new copy"],["ops","element-wise, reduce, matmul"],["result tensor","check .shape and .dtype"]],"mistakes":[{"title":"Random values on an integer tensor","wrong":"x = torch.tensor([[1,2,3],[1,2,3]])\ntorch.rand_like(x)   # x is int64","right":"torch.rand_like(x, dtype=torch.float32)\n# or: torch.rand_like(x.float())","why":"Your notebook hits this: NotImplementedError \"check_uniform_bounds\" not implemented for 'Long'. Uniform random numbers in [0,1) can't be stored as integers."},{"title":"Expecting .to() to change the tensor in place","wrong":"x.to(torch.float32)\nx.dtype   # still torch.int64","right":"x = x.to(torch.float32)\nx.dtype   # torch.float32","why":"Most tensor methods without a trailing underscore return a new tensor. If you don't assign it, the work is discarded."}],"practice":{"task":"Create a 3x4 tensor of random integers between 0 and 9 (as float32). Print the column-wise mean, the row-wise max, and the index of the overall largest value. Then reshape it to (2, 6) and confirm the element count is unchanged.","hint":"Use torch.randint(..., dtype=torch.float32), dim=0 for columns, dim=1 for rows, and .numel() for the count.","solution":"t = torch.randint(0, 10, (3, 4), dtype=torch.float32)\nprint(t.mean(dim=0))          # shape [4]\nprint(t.max(dim=1).values)    # shape [3]\nprint(t.argmax())             # flat index\nr = t.reshape(2, 6)\nassert r.numel() == t.numel() == 12"},"quiz":[{"q":"What is the shape of torch.sum(e, axis=0) when e has shape (2, 3)?","o":["(2,)","(3,)","(2, 3)","() a scalar"],"a":1,"x":"Reducing along dim 0 removes that dimension. The 2 rows collapse and 3 column sums remain."},{"q":"After b = a.clone() and then a[0] = 0, what happens to b?","o":["b's first row also becomes 0","b is unchanged","b raises an error","b becomes a view of a"],"a":1,"x":"clone() copies storage, so the two tensors are independent. Your notebook shows exactly this."},{"q":"Which call fails on an int64 tensor x?","o":["torch.zeros_like(x)","torch.ones_like(x)","torch.rand_like(x)","torch.empty_like(x)"],"a":2,"x":"rand_like samples floats in [0,1) and refuses integer dtypes, which is the NotImplementedError in your notebook."}],"interview":[{"q":"What's the difference between torch.tensor() and torch.from_numpy()?","d":"Easy","t":"Memory sharing between NumPy and PyTorch","a":"torch.tensor() always copies the data. torch.from_numpy() shares memory with the NumPy array, so modifying one modifies the other. from_numpy also keeps NumPy's dtype (often float64).","m":"Saying they're identical, or forgetting that from_numpy inherits float64, which then clashes with float32 model weights.","f":"Your pipeline notebook used from_numpy on StandardScaler output. What dtype did the model weights need to be as a result?"},{"q":"Explain dim in torch.sum(x, dim=1) for a (batch, features) tensor.","d":"Easy","t":"Reasoning about axes","a":"dim names the axis that gets collapsed. dim=1 sums across features, giving one value per sample: shape (batch,). keepdim=True would keep it as (batch, 1).","m":"Thinking dim=1 means 'keep dimension 1'.","f":"When would keepdim=True save you from a broadcasting bug?"},{"q":"When is an in-place operation like relu_() dangerous?","d":"Medium","t":"Autograd + memory semantics","a":"In-place ops overwrite values that autograd may have saved for the backward pass. PyTorch tracks a version counter and raises 'one of the variables needed for gradient computation has been modified by an inplace operation'. They also break aliasing assumptions if other views share storage.","m":"Claiming in-place ops are always faster and therefore always better.","f":"Why does nn.ReLU(inplace=True) in VGG16 not cause this error?"}],"cards":[["What does the trailing underscore mean in add_() or relu_()?","The operation is in-place: it modifies the tensor's own storage instead of returning a new one."],["torch.empty vs torch.zeros?","empty allocates uninitialised memory (garbage values); zeros allocates and fills with 0."],["Shape rule for torch.matmul((n,k),(k,m))","Inner dims must match; result is (n,m)."],["Why use torch.manual_seed?","To make random tensors (and weight init) reproducible across runs."]],"summary":"Tensors = data + shape + dtype + device. Creation: tensor, zeros, ones, rand, arange, linspace, eye, full. Methods without _ return new tensors, so assign the result; methods with _ mutate in place. Reductions remove the dim you name. matmul needs matching inner dims. clone() is a real copy. rand_like refuses integer tensors.","code":"#using empty\n#this allocates memory in space and show already put values in memory\ntensor=torch.empty(2,3)\n\nzero_tensor=torch.zeros(2,3)\n\n#manual_seed\ntorch.manual_seed(100)\n\ntorch.rand(2,3)\ntorch.arange(0,10,2) #for loop types\n\ntorch.linspace(0,10,20) # 20 evnly spaced values btween 0 to 10\n\nx=torch.tensor([[1,2,3],[1,2,3]])\nx\n\nx.shape\nx.reshape(1,1,6)\n\nx.to(torch.float32)\ne=torch.randint(size=(2,3),low=0,high=10,dtype=torch.float32)\n\ntorch.sum(e,axis=0)\ntorch.sum(e,axis=1)\n\nf=torch.randint(size=(2,3),low=0,high=10)\ng=torch.randint(size=(3,2),low=0,high=10)\n\ntorch.matmul(f,g)\ntorch.softmax(k,dim=0)\n\nm.add_(n)\na=torch.rand(2,3)\n\nb=a.clone()\na[0]=0","code_src":"PyTorch_Basics.ipynb","code_cells":"3, 5, 10, 11, 13, 14, 18, 19, 20, 29, 60, 63, 64, 74, 75, 76, 93, 97, 100, 101, 104","short":"Tensor basics","sub":"create, shape, ops"},{"id":"gpu","title":"PyTorch on GPU","nb":"PyTorch_On_GPU.ipynb","concept":"Devices, moving tensors between CPU and GPU, timing GPU work, squeeze/unsqueeze, NumPy interop","apis":["torch.cuda.is_available","torch.device","device= argument",".to(device)","torch.cuda.synchronize","torch.randn","unsqueeze","squeeze",".numpy()","torch.from_numpy"],"what":"Every tensor lives on a device: the CPU or a GPU. This notebook creates tensors directly on CUDA, moves CPU tensors over with `.to(device)`, benchmarks a 1000x1000 matmul on both, and covers the shape helpers `unsqueeze`/`squeeze` and NumPy conversion.","why":"Deep learning is mostly large matrix multiplies, which GPUs run in parallel. Your later notebooks (Dropout ANN, VGG16, LSTM) all move models and batches to `device`. The rule they depend on: every tensor in one operation must be on the same device.","mental":"CPU and GPU are two separate warehouses. `.to(device)` is a delivery truck that copies goods across. Work can only happen in one warehouse at a time, so mixing a CPU tensor and a GPU tensor in one operation fails. GPU work is also queued asynchronously, like placing an order: the call returns before the work is finished.","syntax":"device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\nt = torch.rand(2, 3, device=device)   # create on device\na = a.to(device)                       # move (returns a copy)\ntorch.cuda.synchronize()               # wait for queued GPU work\nx.unsqueeze(0)                         # add a dim at position 0\nx.squeeze(0)                           # remove dim 0 if it has size 1\nn = t.cpu().numpy()                    # GPU -> CPU -> NumPy\nt = torch.from_numpy(n)                # NumPy -> tensor (shares memory)","lines":[["device=torch.device('cuda')","A device handle. Your later notebooks use the safer 'cuda' if available else 'cpu' pattern."],["torch.rand((2,3),device=device)","Allocates directly on the GPU, skipping a CPU-to-GPU copy."],["a=a.to(device) #made on GPU","Copies a to the GPU and rebinds the name. Without the assignment a would stay on the CPU."],["result_gpu=torch.matmul(matrix_gup1,matrix_gup2)","Queues the kernel and returns immediately."],["torch.cuda.synchronize()","Blocks until the GPU finishes, so the timer measures real work. Without it the GPU timing would be misleadingly tiny."],["c.unsqueeze(0,).shape #position where you want to add dim","Returns a (1,226,226,3) view, but only the shape is printed. c itself is unchanged."],["c.squeeze(0,).shape","c is still (226,226,3); dim 0 has size 226, so squeeze does nothing. The notebook's output confirms it."],["b=a.numpy()","Zero-copy view of a CPU tensor as a NumPy array. Would fail for a GPU tensor."],["torch.from_numpy(c)","Zero-copy tensor over NumPy memory, keeping NumPy's dtype."]],"internals":"CUDA operations are launched onto a stream: the Python call enqueues a kernel and returns. Data transfer `.to('cuda')` copies host memory to device memory over PCIe; pinned (page-locked) host memory makes that copy faster and can be asynchronous, which is why your Dropout notebook sets `pin_memory=True`. The first CUDA call also pays one-time initialisation cost, so fair benchmarks warm up first. `numpy()` returns an array that points at the same CPU buffer, which is why it's impossible for a CUDA tensor.","flow":[["CPU tensor","torch.rand(...)"],[".to(device)","copy over PCIe"],["GPU kernel","queued, async"],["synchronize","wait for result"],[".cpu()","copy back for NumPy / printing"]],"mistakes":[{"title":"Discarding the result of unsqueeze","wrong":"c.unsqueeze(0)\nc.squeeze(0).shape   # still (226, 226, 3)","right":"c = c.unsqueeze(0)    # (1, 226, 226, 3)\nc = c.squeeze(0)      # (226, 226, 3)","why":"This is in your notebook: the squeeze looks like it 'worked' but it was a no-op because the unsqueeze result was never stored."},{"title":"Timing GPU code without synchronising","wrong":"start = time.time()\ny = a_gpu @ b_gpu\nprint(time.time() - start)","right":"torch.cuda.synchronize()\nstart = time.time()\ny = a_gpu @ b_gpu\ntorch.cuda.synchronize()\nprint(time.time() - start)","why":"Kernels are asynchronous. Without synchronize you time the launch, not the work. Your notebook synchronises after; a warm-up run first makes it fairer still."}],"practice":{"task":"Write a device-agnostic snippet: pick cuda if available else cpu, create two (500, 500) random tensors on that device, multiply them, and convert the result to a NumPy array. It must run on a laptop without a GPU.","hint":"NumPy can only see CPU memory, so call .cpu() before .numpy().","solution":"device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\na = torch.randn(500, 500, device=device)\nb = torch.randn(500, 500, device=device)\nout = (a @ b).cpu().numpy()\nprint(out.shape, out.dtype)"},"quiz":[{"q":"Why does the notebook call torch.cuda.synchronize() before stopping the GPU timer?","o":["To free GPU memory","Because CUDA kernels run asynchronously","To copy the result back to the CPU","It is required for matmul to work"],"a":1,"x":"The Python call returns as soon as the kernel is queued. synchronize waits for completion so the timer measures real work."},{"q":"c has shape (226, 226, 3). What does c.squeeze(0) return?","o":["(226, 3)","(1, 226, 226, 3)","(226, 226, 3)","An error"],"a":2,"x":"squeeze(0) only removes dim 0 if its size is 1. Here it's 226, so nothing changes."},{"q":"t is a CUDA tensor. What happens on t.numpy()?","o":["It returns a NumPy array on the GPU","It raises an error; you need t.cpu().numpy()","It silently copies to CPU","It returns a list"],"a":1,"x":"NumPy only understands host memory, so you must move the tensor to the CPU first."}],"interview":[{"q":"You get 'Expected all tensors to be on the same device, but found at least two devices, cuda:0 and cpu'. How do you fix it?","d":"Easy","t":"Device placement discipline","a":"Find which operand wasn't moved. Usually the model was moved with model.to(device) but an input, label, or newly created tensor (a mask, a padded sequence) is still on the CPU. Move it with .to(device) or create it with device=. Define device once and use it everywhere.","m":"Moving everything to CPU to 'fix' it, losing the GPU.","f":"Your LSTM prediction() function has exactly this bug when run on a GPU. Which line needs .to(device)?"},{"q":"Why might the first GPU operation in a script look slow?","d":"Medium","t":"CUDA initialisation and benchmarking","a":"The first call initialises the CUDA context, loads kernels and may run autotuning. Benchmarks should do a warm-up iteration, synchronise, then time several runs.","m":"Concluding the GPU is slower than the CPU from a single cold run.","f":"What does torch.backends.cudnn.benchmark = True do and when does it help?"},{"q":"What does pin_memory=True on a DataLoader do?","d":"Medium","t":"Host-to-device transfer","a":"It allocates batches in page-locked host memory, which the GPU can DMA from directly. Transfers become faster and can be asynchronous with .to(device, non_blocking=True). It has no effect without a CUDA GPU (your MPS run warned about this).","m":"Thinking it keeps data on the GPU permanently.","f":"Why does non_blocking=True only help when memory is pinned?"}],"cards":[["What's the device-agnostic idiom?","device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')"],["unsqueeze(0) on shape (3,4)?","(1, 3, 4): adds a size-1 dim at position 0."],["Does torch.from_numpy copy data?","No. It shares memory with the NumPy array."],["Why synchronize before reading a GPU timer?","GPU kernels are asynchronous; synchronize waits for them to finish."]],"summary":"Every tensor has a device. Use one device variable everywhere; move with .to(device) and assign the result. Mixing devices in one op is an error. GPU work is async, so synchronise before timing. squeeze/unsqueeze add or remove size-1 dims and return new tensors. numpy() and from_numpy() share CPU memory; GPU tensors need .cpu() first.","code":"device=torch.device('cuda')\ntorch.rand((2,3),device=device)\n\na=torch.rand(2,3) #made on CPU\na=a.to(device) #made on GPU\n\nimport time\n\nsize=1000\nmatrix_cup1=torch.randn(size,size)\nmatrix_cup2=torch.randn(size,size)\n\nstart_time=time.time()\nresult_cpu=torch.matmul(matrix_cup1,matrix_cup2)\ncpu_time=time.time()-start_time\nprint(cpu_time)\n\nmatrix_gup1=matrix_cup1.to('cuda')\nmatrix_gup2=matrix_cup2.to('cuda')\nstart_time=time.time()\nresult_gpu=torch.matmul(matrix_gup1,matrix_gup2)\ntorch.cuda.synchronize()\ngpu_time=time.time()-start_time\nprint(\"GPU: \",gpu_time)\n\nc.unsqueeze(0,).shape #position where you want to add dim\nc.squeeze(0,).shape\n\nb=a.numpy()\ntorch.from_numpy(c)","code_src":"PyTorch_On_GPU.ipynb","code_cells":"1, 2, 3, 5, 8, 10, 11, 14, 19","short":"GPU and devices","sub":"to(device), sync"},{"id":"autograd","title":"Autograd and backprop","nb":"Auto_Grad_Back.ipynb","concept":"Computing gradients by hand with the chain rule, then letting autograd do it with requires_grad and backward()","apis":["requires_grad=True","grad_fn","loss.backward()",".grad","torch.sigmoid","torch.clamp","torch.log","requires_grad_(False)","torch.no_grad()","detach()"],"what":"Autograd is PyTorch's automatic differentiation engine. Your notebook computes dL/dw and dL/db for a single sigmoid neuron with binary cross-entropy twice: once by multiplying chain-rule factors by hand (6.6918 and 0.9988), and once with `loss.backward()`, which produces the same numbers.","why":"Training means nudging every weight in the direction that reduces the loss, which needs the gradient of the loss with respect to every weight. Doing that by hand is fine for one neuron and impossible for VGG16's 138M parameters. Autograd records the operations and replays them backwards for you.","mental":"As you compute forward, PyTorch writes a receipt: each result remembers the function that made it (`grad_fn`) and its inputs. `backward()` walks the receipt in reverse, multiplying local derivatives (the chain rule) and depositing the totals into each leaf's `.grad`. Gradients add into `.grad` rather than replacing it, so you have to clear them between steps.","syntax":"w = torch.tensor(1.0, requires_grad=True)   # leaf to track\nz = w * x + b                                # z.grad_fn = <AddBackward0>\nloss = some_loss(torch.sigmoid(z), y)\nloss.backward()                              # fill w.grad, b.grad\nw.grad                                       # dLoss/dw\nw.grad.zero_()                               # reset before next step\nwith torch.no_grad():                        # stop tracking (updates/eval)\n    w -= lr * w.grad\ny = z.detach()                               # tensor cut from the graph","lines":[["prediction = torch.clamp(prediction, epsilon, 1 - epsilon)","Keeps predictions away from exactly 0 or 1 so log() never returns -inf."],["return -(target * torch.log(prediction) + (1 - target) * torch.log(1 - prediction))","Binary cross-entropy for one sample."],["w = torch.tensor(1.0, requires_grad=True)","Marks w as a leaf whose gradient we want. x and y are data and don't need gradients."],["z = w*x + b","Output shows grad_fn=<AddBackward0>: the graph is being recorded."],["y_pred = torch.sigmoid(z)","grad_fn=<SigmoidBackward0>. Autograd knows d(sigmoid)/dz = s(1-s), the same factor you wrote by hand."],["loss.backward()","Walks the graph backwards from loss and accumulates dloss/dw into w.grad and dloss/db into b.grad."],["print(w.grad)","tensor(6.6918), matching the manual 6.691762... That's the check that autograd and the chain rule agree."]],"internals":"Each differentiable op creates a Node in a directed acyclic graph and saves whatever it needs for the backward pass (sigmoid saves its output). `backward()` starts with a gradient of 1.0 at the scalar loss and runs each node's backward function in reverse topological order, multiplying by the incoming gradient (vector-Jacobian products). Leaf tensors with requires_grad accumulate the result into `.grad` with `+=`. The graph is freed after backward unless you pass retain_graph=True. Inside `torch.no_grad()` no nodes are recorded at all.","flow":[["x, w, b","leaves; w, b require grad"],["z = w*x + b","AddBackward0"],["sigmoid(z)","SigmoidBackward0"],["BCE loss","NegBackward0"],["loss.backward()","chain rule in reverse"],["w.grad, b.grad","accumulated"]],"mistakes":[{"title":"Calling backward() on a tensor that isn't part of a graph","wrong":"y = torch.tensor(0.0)   # the target\ny.backward()","right":"loss = binary_cross_entropy_loss(y_pred, y)\nloss.backward()","why":"Your notebook's last cell raises RuntimeError: element 0 of tensors does not require grad and does not have a grad_fn. y is the label, a constant with no history."},{"title":"Calling torch.no_grad() as a statement","wrong":"torch.no_grad()      # does nothing\nw -= lr * w.grad","right":"with torch.no_grad():\n    w -= lr * w.grad","why":"no_grad is a context manager. Calling it without 'with' creates the object and throws it away; tracking stays on."}],"practice":{"task":"Compute the gradient of f(a) = a^3 + 2a at a = 2 both by hand (3a^2 + 2) and with autograd. Then call backward a second time without zeroing and observe what happens to a.grad.","hint":"Rebuild f before the second backward, because the graph is freed after the first one.","solution":"a = torch.tensor(2.0, requires_grad=True)\nf = a**3 + 2*a\nf.backward()\nprint(a.grad)          # 14.0 = 3*4 + 2\nf = a**3 + 2*a\nf.backward()\nprint(a.grad)          # 28.0 - accumulated!\na.grad.zero_()"},"quiz":[{"q":"Why must you zero gradients between training steps?","o":["backward() overwrites .grad, so zeroing is cosmetic","backward() adds into .grad, so old gradients would accumulate","zero_grad frees GPU memory","The optimizer can't read non-zero gradients"],"a":1,"x":"Gradients accumulate by design (useful for gradient accumulation), so each step must start from zero."},{"q":"What does grad_fn=<SigmoidBackward0> on y_pred tell you?","o":["y_pred is a leaf tensor","y_pred was produced by sigmoid and is part of the autograd graph","sigmoid has been differentiated already","y_pred has requires_grad=False"],"a":1,"x":"grad_fn records the operation that created the tensor; backward uses it to route gradients."},{"q":"Which correctly disables tracking for a weight update?","o":["torch.no_grad()\nw -= lr*w.grad","with torch.no_grad():\n    w -= lr*w.grad","w.backward(False)","w.grad = None"],"a":1,"x":"no_grad must be used as a context manager. The bare call in your notebook has no effect."}],"interview":[{"q":"Walk me through what happens when you call loss.backward().","d":"Medium","t":"Understanding of the computation graph","a":"During forward, each op on tensors that require grad records a node with its inputs and saved values. backward() seeds dL/dL = 1 and traverses the graph in reverse topological order, each node applying its local derivative (a vector-Jacobian product) and passing the result upstream. Leaf tensors with requires_grad accumulate into .grad. The graph is then freed.","m":"Saying backward 'updates the weights'. It only computes gradients; the optimizer updates.","f":"Why does calling backward twice on the same loss raise 'Trying to backward through the graph a second time'?"},{"q":"Compare torch.no_grad(), .detach() and requires_grad_(False).","d":"Medium","t":"Graph control tools","a":"no_grad is a context: nothing computed inside is recorded, used for evaluation and manual updates. detach() returns a new tensor sharing data but cut from the graph, used to stop gradients flowing through one value. requires_grad_(False) permanently flips a leaf so it's no longer trained, used to freeze layers (your VGG16 notebook does this for the conv base).","m":"Treating them as interchangeable.","f":"Which would you use to freeze VGG16's features, and why not no_grad?"},{"q":"Your manual gradient was dL/dw = 6.6918 for x = 6.7, y = 0. Why is it almost exactly x?","d":"Hard","t":"Chain rule intuition for sigmoid + BCE","a":"For sigmoid followed by BCE, the factors simplify: dL/dz = y_pred - y. Here y_pred = 0.9988 and y = 0, so dL/dz is about 0.9988, and dz/dw = x = 6.7, giving about 6.69. The s(1-s) terms cancel, which is also why BCEWithLogitsLoss is numerically nicer.","m":"Multiplying the factors without noticing they cancel.","f":"What happens to this gradient if you compute BCE without clamping and y_pred rounds to exactly 1.0?"}],"cards":[["What does requires_grad=True do?","Tells autograd to record operations on this tensor so gradients can be computed for it."],["Where does backward() store results?","In the .grad attribute of leaf tensors that require grad."],["Do gradients overwrite or accumulate?","Accumulate (+=). Clear them with zero_grad() or .grad.zero_()."],["For sigmoid + BCE, dL/dz equals?","y_pred - y. The sigmoid derivative cancels."]],"summary":"requires_grad marks leaves to track. Every op records a grad_fn, building a graph. loss.backward() applies the chain rule in reverse and accumulates into .grad, so zero them each step. Use 'with torch.no_grad():' for updates and evaluation, detach() to cut one tensor, requires_grad_(False) to freeze. Only call backward on the loss, never on a constant.","code":"def binary_cross_entropy_loss(prediction, target):\n  epsilon = 1e-8\n  prediction = torch.clamp(prediction, epsilon, 1 - epsilon)\n  return -(target * torch.log(prediction) + (1 - target) * torch.log(1 - prediction))\n\nx = torch.tensor(6.7)\ny = torch.tensor(0.0)\n\nw = torch.tensor(1.0, requires_grad=True)\nb = torch.tensor(0.0, requires_grad=True)\n\nz = w*x + b\nz\n\ny_pred = torch.sigmoid(z)\ny_pred\n\nloss = binary_cross_entropy_loss(y_pred, y)\nloss\n\nloss.backward()\n\nprint(w.grad)\nprint(b.grad)","code_src":"Auto_Grad_Back.ipynb","code_cells":"1, 9, 10, 11, 12, 13, 14, 15","short":"Autograd","sub":"backward(), .grad"},{"id":"nnmodule","title":"nn.Module","nb":"NN_Module.ipynb / NN_Module_updated.ipynb","concept":"Packaging layers and a forward pass in a class; parameters registered automatically; inspecting with torchinfo","apis":["nn.Module","super().__init__()","nn.Linear","nn.Sigmoid","forward()","model(x)","model.parameters()","torchinfo.summary"],"what":"`nn.Module` is the base class for every model. You declare layers as attributes in `__init__` and describe how data flows through them in `forward`. NN_Module.ipynb builds a 5-input logistic regression (Linear(5,1) + Sigmoid); the updated version adds a hidden layer of 3 units.","why":"Your manual pipeline kept weights as loose tensors and wrote the maths by hand. nn.Module registers every layer's weights automatically so `model.parameters()` can hand them to an optimizer, `model.to(device)` can move them, and `model.eval()` can switch modes, all in one call.","mental":"A Module is a labelled box of parts. Anything you attach as `self.something = nn.Layer(...)` gets added to the box's inventory. `forward` is the assembly instruction. Calling `model(x)` runs the instruction through PyTorch's front desk (`__call__`), which also runs hooks; calling `model.forward(x)` directly skips the desk.","syntax":"class Model(nn.Module):\n    def __init__(self, num_features):\n        super().__init__()                     # must come first\n        self.linear = nn.Linear(num_features, 1)\n        self.sigmoid = nn.Sigmoid()\n\n    def forward(self, x):                      # exact name: forward\n        return self.sigmoid(self.linear(x))\n\nmodel = Model(5)\nout = model(x)                                 # not model.forward(x)\nlist(model.parameters())                       # weights + biases","lines":[["class Model(nn.Module):","Inheriting gives you parameter tracking, .to(), .train()/.eval(), state_dict and more."],["super().__init__()","Initialises Module's internal registries. Assigning a layer before this raises an AttributeError."],["self.linear1 = nn.Linear(num_features, 3)","Weights (3x5) and bias (3) are created with random init and registered as parameters."],["self.relu = nn.Sigmoid()","Named relu but it's a Sigmoid. It works, but the name lies about the activation in use."],["self.linear2 = nn.Linear(3, 1)","The 3 hidden units feed one output unit."],["def forward(self, features):","Must be spelled forward. Your history shows a 'forwad' typo that was fixed in commit 8751159."],["out = model.forward(features)","Works, but bypasses __call__ and its hooks. Prefer model(features)."],["summary(model, input_size=(10, 5))","torchinfo runs a dummy batch and prints each layer's output shape and parameter count."]],"internals":"`nn.Module.__setattr__` intercepts attribute assignment: if the value is a Parameter it goes into `_parameters`, if it's a Module it goes into `_modules`. `parameters()` walks that tree recursively. `model(x)` calls `__call__`, which runs forward pre-hooks, then `forward`, then forward hooks; torchinfo itself works by registering hooks. `nn.Linear` stores weight with shape (out, in) and computes x @ W.T + b, initialised with Kaiming-uniform.","flow":[["__init__","register layers"],["model(x)","__call__ + hooks"],["forward(x)","linear1 -> act -> linear2 -> sigmoid"],["output","(batch, 1), grad_fn set"],["parameters()","handed to optimizer"]],"mistakes":[{"title":"Misspelling forward","wrong":"def forwad(self, features):\n    ...\nout = model(features)","right":"def forward(self, features):\n    ...\nout = model(features)","why":"Your original NN_Module had 'forwad' and called model.forwad() directly, which hid the problem. model(x) would raise NotImplementedError: Module [Model] is missing the required \"forward\" function."},{"title":"Layer names that don't match the layer","wrong":"self.relu = nn.Sigmoid()","right":"self.act = nn.Sigmoid()   # or nn.ReLU() if you meant ReLU","why":"NN_Module_updated has this. The model trains, but anyone reading forward() assumes ReLU, and it changes the gradient behaviour (sigmoid saturates)."}],"practice":{"task":"Write a Module with Linear(4, 8) -> ReLU -> Linear(8, 2). Count its parameters by hand, then confirm with sum(p.numel() for p in model.parameters()).","hint":"A Linear(in, out) has in*out weights plus out biases.","solution":"class Net(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.fc1 = nn.Linear(4, 8)\n        self.act = nn.ReLU()\n        self.fc2 = nn.Linear(8, 2)\n    def forward(self, x):\n        return self.fc2(self.act(self.fc1(x)))\n\nm = Net()\nprint(sum(p.numel() for p in m.parameters()))  # (4*8+8)+(8*2+2) = 58"},"quiz":[{"q":"How many parameters does nn.Linear(5, 3) have?","o":["8","15","18","20"],"a":2,"x":"5x3 weights plus 3 biases = 18."},{"q":"Why prefer model(x) over model.forward(x)?","o":["It's faster","model(x) goes through __call__, which runs hooks","forward() doesn't compute gradients","They differ in output shape"],"a":1,"x":"__call__ wraps forward with hook handling; tools like torchinfo rely on it."},{"q":"What happens if you assign self.fc = nn.Linear(...) before super().__init__()?","o":["Nothing, order doesn't matter","AttributeError: cannot assign module before Module.__init__() call","The layer is created but not trained","It's silently ignored"],"a":1,"x":"Module's registries don't exist until super().__init__() runs."}],"interview":[{"q":"How does PyTorch know which tensors are a model's parameters?","d":"Easy","t":"Module registration","a":"nn.Module overrides __setattr__. Assigning an nn.Parameter or a sub-Module as an attribute registers it in _parameters or _modules. parameters() recursively yields them. Plain tensors assigned as attributes are not registered (use register_buffer for non-trainable state).","m":"Saying PyTorch scans for any tensor with requires_grad.","f":"If you store layers in a Python list instead of nn.ModuleList, what breaks?"},{"q":"Your NN_Module_updated stacks Linear -> Sigmoid -> Linear -> Sigmoid. What's the downside of sigmoid in hidden layers?","d":"Medium","t":"Activation choice and vanishing gradients","a":"Sigmoid saturates: for large |z| its derivative s(1-s) is near 0 (max 0.25), so gradients shrink layer by layer. It's also not zero-centred. ReLU avoids saturation for positive inputs and is cheaper, which is why your MNIST ANN uses it.","m":"Saying sigmoid is wrong everywhere; it's still right at a binary output.","f":"What problem can ReLU have instead, and what fixes it?"},{"q":"What does torchinfo.summary need input_size for?","d":"Easy","t":"Dynamic graphs","a":"PyTorch builds the graph by running code, so shapes aren't known until a forward pass happens. summary creates a dummy input of that size, runs it with hooks attached, and records each layer's output shape and parameter count.","m":"Thinking summary reads shapes from the class definition statically.","f":"Why can't PyTorch know output shapes ahead of time the way Keras' model.summary() can for a Sequential model?"}],"cards":[["Two methods every nn.Module needs","__init__ (declare layers, call super().__init__() first) and forward (define computation)."],["nn.Linear(in, out) computes","x @ W.T + b, with W shaped (out, in)."],["Why call model(x) not model.forward(x)?","__call__ runs hooks around forward; tools depend on them."],["What breaks if you misspell forward?","model(x) raises NotImplementedError: missing the required \"forward\" function."]],"summary":"Subclass nn.Module, call super().__init__() first, assign layers as attributes so they register, define forward (spelled exactly). Call model(x), not model.forward(x). parameters() gives every weight to the optimizer. Name layers for what they are. torchinfo.summary runs a dummy pass to show shapes and parameter counts.","code":"import torch\nimport torch.nn as nn\n\nclass Model(nn.Module):\n    def __init__(self, num_features):\n        super().__init__()\n\n        self.linear1 = nn.Linear(num_features, 3)\n        self.relu = nn.Sigmoid()\n        self.linear2 = nn.Linear(3, 1)\n        self.sigmoid = nn.Sigmoid()\n\n    def forward(self, features):\n        out = self.linear1(features)\n        out = self.relu(out)\n        out = self.linear2(out)\n        out = self.sigmoid(out)\n\n        return out\n\nfeatures = torch.rand(10, 5)\n\nmodel = Model(features.shape[1])\n\nout = model.forward(features)\n\nout\n\nfrom torchinfo import summary\n\nsummary(model, input_size=(10, 5))","code_src":"NN_Module_updated.ipynb + NN_Module.ipynb","code_cells":"0, 1 + 2","short":"nn.Module","sub":"Linear, forward()"},{"id":"pipeline","title":"Training pipeline from scratch","nb":"pytorch_training_pipeline.ipynb","concept":"End-to-end binary classifier on breast-cancer data with raw tensors: preprocessing, manual forward, manual BCE, manual gradient descent","apis":["train_test_split","StandardScaler","LabelEncoder","torch.from_numpy",".double()",".view(-1,1)","torch.matmul","torch.sigmoid","loss.backward()","torch.no_grad()","grad.zero_()",".item()"],"what":"A logistic-regression model built from bare tensors: a (30,1) weight, a bias, a hand-written forward pass, a hand-written BCE loss and a hand-written update `w -= lr * w.grad`. It runs on the Wisconsin breast-cancer CSV (569 rows, 30 features, M/B labels).","why":"This is the skeleton every later notebook keeps: forward, loss, backward, update, zero gradients, repeat. Writing it by hand once makes it obvious what `nn.Linear`, `nn.BCELoss` and `optim.SGD` replace in the next notebook. It also shows how easily it breaks: this notebook prints nan for all 25 epochs.","mental":"Think of a hiker in fog finding the valley floor. Forward pass: where am I? Loss: how high am I? Backward: which way is downhill? Update: take a step of size learning_rate. Zero grad: forget the old slope reading before taking the next one.","syntax":"for epoch in range(epochs):\n    y_pred = model.forward(X)          # 1. forward\n    loss = loss_fn(y_pred, y)          # 2. loss\n    loss.backward()                    # 3. gradients\n    with torch.no_grad():              # 4. update without tracking\n        w -= lr * w.grad\n        b -= lr * b.grad\n    w.grad.zero_(); b.grad.zero_()     # 5. reset","lines":[["X_train = scaler.fit_transform(X_train)","Fit mean/std on training data only, then transform. Test uses transform() so no test statistics leak in."],["encoder=LabelEncoder()","Maps 'B'/'M' strings to 0/1."],["X_train_tensor=torch.from_numpy(X_train)","StandardScaler returns float64, so this tensor is float64 and the weights must match."],["y_train_tensor=torch.from_numpy(y_train).double().view(-1,1)","Labels become float64 with shape (455,1) to line up with predictions."],["y_test_tensor=torch.from_numpy(y_test)","No .view(-1,1) and no .double() here: shape (114,), int64. This causes the evaluation bug."],["self.weight=torch.rand(X.shape[1],1,dtype=torch.float64,requires_grad=True)","Weights in [0,1), all positive. With 30 standardised features z can get large, pushing sigmoid to exactly 1.0."],["epsilon=1e-7","Defined but never used: there's no clamp, so log(0) is possible."],["loss = -(y_train_tensor * torch.log(y_pred) + (1 - y_train_tensor)*torch.log(1 - y_pred)).mean()","Uses the global y_train_tensor instead of the y parameter. When y_pred hits 1.0, log(1-1) = -inf and 0 * -inf = nan."],["model.weight -= learning_rate * model.weight.grad","Gradient descent step, done inside no_grad so the update itself isn't recorded."],["model.weight.grad.zero_()","Clears accumulated gradients for the next epoch."]],"internals":"Each epoch builds a fresh graph: matmul -> add -> sigmoid -> log -> mul -> mean. backward fills `.grad` on the two leaves. Under no_grad, `-=` is an in-place update on a leaf, which is allowed because nothing is being recorded. When any element of y_pred is exactly 1.0 in float64 (sigmoid(z) rounds to 1 for z above about 37), `log(1 - y_pred)` is -inf, the product with a 0 label is nan, and nan propagates into the mean, the gradients and then the weights, so every later epoch is nan too.","flow":[["CSV","569 x 32"],["split + scale + encode","sklearn"],["from_numpy","float64 tensors"],["forward","sigmoid(XW + b)"],["BCE loss","manual"],["backward + update","no_grad, zero_"]],"mistakes":[{"title":"Loss function ignores its arguments and doesn't clamp","wrong":"def loss_function(self, y_pred, y):\n    epsilon = 1e-7\n    loss = -(y_train_tensor * torch.log(y_pred)\n             + (1 - y_train_tensor) * torch.log(1 - y_pred)).mean()\n    return loss","right":"def loss_function(self, y_pred, y):\n    epsilon = 1e-7\n    y_pred = torch.clamp(y_pred, epsilon, 1 - epsilon)\n    return -(y * torch.log(y_pred)\n             + (1 - y) * torch.log(1 - y_pred)).mean()","why":"Two bugs in one: the global label tensor is used (so the function silently can't evaluate test data), and epsilon is never applied, which produces your nan loss."},{"title":"Comparing (N,1) predictions with (N,) labels","wrong":"accuracy = (y_pred == y_test_tensor).float().mean()\n# (114,1) == (114,) -> (114,114)","right":"accuracy = (y_pred.view(-1) == y_test_tensor).float().mean()","why":"Broadcasting turns the comparison into a 114x114 grid, so the 'accuracy' is the fraction of all prediction/label pairs that match, roughly the class balance."}],"practice":{"task":"Fix this notebook so it trains: apply the clamp, use the y parameter, and reshape y_test_tensor. Then print loss every 5 epochs and the final test accuracy.","hint":"Also consider initialising weights with torch.randn(...) * 0.01 instead of torch.rand so z starts near 0.","solution":"self.weight = (torch.randn(X.shape[1], 1, dtype=torch.float64) * 0.01).requires_grad_()\n...\ny_pred = torch.clamp(y_pred, 1e-7, 1 - 1e-7)\nloss = -(y*torch.log(y_pred) + (1-y)*torch.log(1-y_pred)).mean()\n...\ny_test_tensor = torch.from_numpy(y_test).double().view(-1, 1)\nacc = ((model.forward(X_test_tensor) > 0.5).double() == y_test_tensor).double().mean()"},"quiz":[{"q":"Why does the loss print nan for every epoch?","o":["The learning rate is too small","log(1 - y_pred) = -inf when y_pred is exactly 1.0, and 0 * -inf = nan","StandardScaler produced nan values","zero_() was called before backward()"],"a":1,"x":"epsilon was defined but never applied. Once nan enters the loss it spreads to gradients and weights."},{"q":"Why use scaler.transform (not fit_transform) on X_test?","o":["It's faster","To use training statistics and avoid leaking test information","fit_transform doesn't work on small arrays","To keep dtype float32"],"a":1,"x":"The model must be evaluated as if test data were unseen, so scaling uses the training mean/std."},{"q":"Why is the weight update wrapped in torch.no_grad()?","o":["To make it faster only","So the update isn't recorded in the graph and in-place ops on leaves are allowed","Because .grad is read-only otherwise","It isn't necessary"],"a":1,"x":"Updating a leaf that requires grad in-place while tracking raises an error, and we don't want the update differentiated."}],"interview":[{"q":"List the five steps of a training iteration and what breaks if each is skipped.","d":"Easy","t":"Core training loop","a":"Forward (no prediction), loss (nothing to minimise), backward (no gradients, .grad is None), update (weights never change), zero grad (gradients accumulate across steps, so effective step size grows and training diverges).","m":"Forgetting zero_grad, or putting it between backward and step.","f":"Where can zero_grad legally go in the loop?"},{"q":"Your loss is nan from epoch 0. How do you debug it?","d":"Medium","t":"Numerical stability debugging","a":"Check inputs for nan/inf (torch.isnan(X).any()), check predictions' range (y_pred.min(), y_pred.max()), look for log(0), division by 0, or exploding activations. Here y_pred reaches exactly 1.0 so log(1 - y_pred) = -inf. Fix by clamping, using BCEWithLogitsLoss on raw logits, or smaller initial weights. torch.autograd.set_detect_anomaly(True) can point at the op that produced nan.","m":"Lowering the learning rate without checking the first forward pass, which is already nan at epoch 0.","f":"Why is BCEWithLogitsLoss more stable than sigmoid followed by BCELoss?"},{"q":"Why does from_numpy on StandardScaler output cause dtype issues?","d":"Easy","t":"dtype awareness","a":"StandardScaler returns float64, and from_numpy keeps it. nn.Linear weights default to float32, so mixing them raises 'mat1 and mat2 must have the same dtype'. This notebook avoided it by making weights float64; the nn.Module version uses .astype(np.float32).","m":"Not knowing the default dtypes on both sides.","f":"Is float64 training ever worth it?"}],"cards":[["Five steps of a training step","forward, loss, backward, update (under no_grad), zero gradients."],["Why clamp predictions before log() in BCE?","To avoid log(0) = -inf, which produces nan."],["fit_transform vs transform","Fit statistics on train only; apply the same transform to test."],["(N,1) == (N,) gives shape?","(N, N), through broadcasting. A silent bug in accuracy code."]],"summary":"Manual pipeline: preprocess with sklearn (fit on train only), convert with from_numpy (float64!), forward = sigmoid(XW+b), BCE loss, backward, update under no_grad, zero grads. This notebook's nan comes from an unused epsilon plus a loss that reads the global labels; its eval compares (114,1) with (114,). Clamp, use parameters, match shapes.","code":"X_train, X_test, y_train, y_test = train_test_split(df.iloc[:, 1:], df.iloc[:, 0], test_size=0.2)\n\nscaler = StandardScaler()\nX_train = scaler.fit_transform(X_train)\nX_test = scaler. transform(X_test)\n\nencoder=LabelEncoder()\ny_train=encoder.fit_transform(y_train)\n\nX_train_tensor=torch.from_numpy(X_train)\nX_test_tensor=torch.from_numpy(X_test)\ny_train_tensor=torch.from_numpy(y_train).double().view(-1,1)\ny_test_tensor=torch.from_numpy(y_test)\n\nclass SimpleNN():\n  def __init__(self,X):\n    self.weight=torch.rand(X.shape[1],1,dtype=torch.float64,requires_grad=True)\n    self.bias=torch.zeros(1,dtype=torch.float64,requires_grad=True)\n\n  def forward(self,X):\n    z=torch.matmul(X,self.weight) + self.bias\n    y_pred=torch.sigmoid(z)\n    return y_pred\n\n  def loss_function(self,y_pred,y):\n    epsilon=1e-7\n    # Calculate loss\n    loss = -(y_train_tensor * torch.log(y_pred) + (1 - y_train_tensor)*torch.log(1 - y_pred)).mean()\n    return loss\n\n# Loop\nfor epoch in range(epochs):\n\n    # Forward pass\n    y_pred = model.forward(X_train_tensor)\n\n    # Loss\n    loss = model.loss_function(y_pred, y_train_tensor)\n\n    # Backward pass\n    loss.backward()\n\n    # Weight update\n    with torch.no_grad():\n        model.weight -= learning_rate * model.weight.grad\n        model.bias -= learning_rate * model.bias.grad\n\n    # Reset gradients\n    model.weight.grad.zero_()\n    model.bias.grad.zero_()\n\n    print(loss.item(), epoch)\n\nwith torch.no_grad():\n  y_pred = model.forward(X_test_tensor)\n  y_pred=(y_pred>0.5).float()\n  accuracy=(y_pred==y_test_tensor).float().mean()\n  print(accuracy.item())","code_src":"pytorch_training_pipeline.ipynb","code_cells":"3, 4, 7, 10, 11, 17, 18","short":"Manual pipeline","sub":"raw tensors, manual BCE"},{"id":"pipeline_nn","title":"Pipeline with nn.Module","nb":"pytorch_training_pipeline_using_nn_module(_updated).ipynb","concept":"The same breast-cancer classifier rebuilt with nn.Linear, nn.BCELoss and torch.optim.SGD","apis":["astype(np.float32)","nn.Module","nn.Linear","nn.Sigmoid","nn.BCELoss","torch.optim.SGD","model.parameters()","optimizer.zero_grad()","optimizer.step()",".view(-1,1)"],"what":"The manual pipeline with its hand-written pieces swapped for library ones: `MySimpleNN` replaces the loose weight tensors, `nn.BCELoss()` replaces the hand-written loss, and `optim.SGD` replaces the manual `w -= lr * w.grad` and `.grad.zero_()` lines. The loss now drops cleanly from 0.82 to around 0.15.","why":"Library components are tested, numerically careful (BCELoss clamps its log output internally) and scale to any number of parameters. The optimizer loop stays identical whether the model has 31 parameters or 138 million, and swapping SGD for Adam is a one-line change, which the Optuna notebook depends on.","mental":"Same hike, better gear. The model is the hiker's body, the loss function is the altimeter, and the optimizer is the legs: you tell it which parameters to move (`model.parameters()`) and how big a stride (`lr`), and `step()` takes the stride.","syntax":"model = MySimpleNN(X_train_tensor.shape[1])\nloss_function = nn.BCELoss()\noptimizer = torch.optim.SGD(model.parameters(), lr=0.1)\n\nfor epoch in range(epochs):\n    y_pred = model(X_train_tensor)\n    loss = loss_function(y_pred, y_train_tensor.view(-1, 1))\n    optimizer.zero_grad()\n    loss.backward()\n    optimizer.step()","lines":[["X_train_tensor = torch.from_numpy(X_train.astype(np.float32))","Casts to float32 first, matching nn.Linear's default weight dtype."],["y_train_tensor = torch.from_numpy(y_train.astype(np.float32))","Shape (455,). It's reshaped at loss time instead of here."],["self.linear = nn.Linear(num_features, 1)","Replaces the manual (30,1) weight and bias, with sensible small random init."],["loss_function = nn.BCELoss()","Mean binary cross-entropy; clamps log outputs at -100 internally, so no nan here."],["optimizer = torch.optim.SGD(model.parameters(), lr=learning_rate)","The optimizer holds references to every registered parameter."],["loss = loss_function(y_pred, y_train_tensor.view(-1,1))","BCELoss requires matching shapes: (455,1) vs (455,1)."],["optimizer.zero_grad()","Replaces the two manual .grad.zero_() calls."],["optimizer.step()","Replaces the manual no_grad update: p -= lr * p.grad for every parameter."],["accuracy = (y_pred == y_test_tensor).float().mean()","Bug: y_pred is (114,1), y_test_tensor is (114,). Broadcasts to (114,114), giving the 0.5526 accuracy in your output."]],"internals":"`optim.SGD` stores `param_groups`, each a list of parameter tensors plus hyperparameters. `step()` loops over them and, for plain SGD, does `p.add_(p.grad, alpha=-lr)` under no_grad. `zero_grad()` sets each `.grad` to None by default (since PyTorch 2.0), which saves memory and makes the next backward allocate fresh. `nn.BCELoss` checks that input and target sizes match and raises a ValueError if they don't, which is why the training loop needs `.view(-1,1)`. The equality test in evaluation has no such check, so it silently broadcasts.","flow":[["float32 tensors","astype(np.float32)"],["model(X)","Linear -> Sigmoid"],["nn.BCELoss","shapes must match"],["zero_grad + backward","fresh gradients"],["optimizer.step()","p -= lr * grad"],["evaluate","threshold 0.5"]],"mistakes":[{"title":"Broadcasting in the accuracy check","wrong":"y_pred = (y_pred > 0.5).float()          # (114, 1)\naccuracy = (y_pred == y_test_tensor).float().mean()  # vs (114,)","right":"y_pred = (y_pred > 0.5).float().view(-1)  # (114,)\naccuracy = (y_pred == y_test_tensor).float().mean()","why":"Both versions of this notebook report about 55% even though training loss reached about 0.15. The DataLoader notebook adds .view(-1) and reports 95%."},{"title":"Feeding float64 into nn.Linear","wrong":"X = torch.from_numpy(X_train)        # float64\nmodel(X)","right":"X = torch.from_numpy(X_train.astype(np.float32))\nmodel(X)","why":"Raises RuntimeError: mat1 and mat2 must have the same dtype. This notebook does it right; it's the reason for astype."}],"practice":{"task":"Swap SGD for Adam (lr=0.01), fix the accuracy line, and add a check that prints the shapes of y_pred and y_test_tensor before comparing them.","hint":"assert y_pred.shape == y_test_tensor.shape is a cheap guard worth keeping in every eval loop.","solution":"optimizer = torch.optim.Adam(model.parameters(), lr=0.01)\n...\nwith torch.no_grad():\n    y_pred = (model(X_test_tensor) > 0.5).float().view(-1)\n    assert y_pred.shape == y_test_tensor.shape, (y_pred.shape, y_test_tensor.shape)\n    print((y_pred == y_test_tensor).float().mean().item())"},"quiz":[{"q":"Training loss is about 0.15 but test accuracy prints 0.55. Most likely cause?","o":["Severe overfitting","A shape mismatch broadcasting the comparison","The learning rate is too high","BCELoss is the wrong loss"],"a":1,"x":"(114,1) == (114,) becomes a 114x114 comparison. A low loss with a coin-flip accuracy is the clue."},{"q":"What does optimizer.step() do for plain SGD?","o":["Computes gradients","Sets gradients to zero","Updates every parameter: p = p - lr * p.grad","Moves the model to GPU"],"a":2,"x":"backward computes gradients; step applies the update rule to every parameter it was given."},{"q":"Why does BCELoss need y_train_tensor.view(-1,1)?","o":["BCELoss only accepts 2-D tensors","Input (455,1) and target must have the same shape","To convert dtype","It doesn't need it"],"a":1,"x":"BCELoss raises a ValueError when target size differs from input size."}],"interview":[{"q":"What's the order of zero_grad, backward and step, and why?","d":"Easy","t":"Optimizer mechanics","a":"zero_grad must happen before backward (anywhere earlier in the iteration); backward fills .grad; step consumes .grad. The common order is zero_grad, forward, loss, backward, step, or forward, loss, zero_grad, backward, step as in your notebook. Putting zero_grad between backward and step would erase the gradients before they're used.","m":"Saying zero_grad must come right after step without explaining why.","f":"How would you implement gradient accumulation over 4 mini-batches?"},{"q":"BCELoss vs BCEWithLogitsLoss: which would you use here and why?","d":"Medium","t":"Numerical stability","a":"BCEWithLogitsLoss: drop the final Sigmoid and pass raw logits. It fuses sigmoid and log using the log-sum-exp trick, so it never computes log(0), and gradients are better behaved. BCELoss after a separate sigmoid can saturate (it clamps its log at -100 to avoid inf).","m":"Applying sigmoid in the model and then using BCEWithLogitsLoss, which applies sigmoid twice.","f":"What would you then use at inference to get a probability?"},{"q":"How would you catch the broadcasting accuracy bug automatically?","d":"Medium","t":"Defensive coding","a":"Assert shapes before elementwise comparisons, compute accuracy with a single tested helper, sanity-check that accuracy is plausible given the loss, and compare to a baseline (predicting the majority class gives about 63% here, so 55% is worse than trivial).","m":"Relying on 'it runs without errors' as evidence of correctness.","f":"Which operations in PyTorch broadcast silently and which check shapes?"}],"cards":[["What does optimizer.zero_grad() replace from the manual loop?","The per-parameter .grad.zero_() calls."],["What does optimizer.step() replace?","The manual 'with no_grad: p -= lr * p.grad' updates."],["Why astype(np.float32) before from_numpy?","nn.Linear weights are float32; float64 inputs cause a dtype mismatch error."],["Low loss but ~55% accuracy on a binary task suggests?","A broadcasting/shape bug in the evaluation, not a bad model."]],"summary":"nn.Linear + nn.BCELoss + optim.SGD replace the hand-written parts; the loop shape stays the same: forward, loss, zero_grad, backward, step. Use float32 inputs. BCELoss demands matching shapes, but == broadcasts silently, which is why both versions of this notebook report about 55% instead of about 95%. Flatten predictions with .view(-1) before comparing.","code":"X_train_tensor = torch.from_numpy(X_train.astype(np.float32))\nX_test_tensor = torch.from_numpy(X_test.astype(np.float32))\ny_train_tensor = torch.from_numpy(y_train.astype(np.float32))\ny_test_tensor = torch.from_numpy(y_test.astype(np.float32))\n\nimport torch.nn as nn\n\n\nclass MySimpleNN(nn.Module):\n\n  def __init__(self, num_features):\n\n    super().__init__()\n    self.linear = nn.Linear(num_features, 1)\n    self.sigmoid = nn.Sigmoid()\n\n  def forward(self, features):\n\n    out = self.linear(features)\n    out = self.sigmoid(out)\n\n    return out\n\n# define loss function\nloss_function = nn.BCELoss()\n\n# create model\nmodel = MySimpleNN(X_train_tensor.shape[1])\n\n# define optimizer\noptimizer = torch.optim.SGD(model.parameters(), lr=learning_rate)\n\n# define loop\nfor epoch in range(epochs):\n\n  # forward pass\n  y_pred = model(X_train_tensor)\n\n  # loss calculate\n  loss = loss_function(y_pred, y_train_tensor.view(-1,1))\n\n  # clear gradients\n  optimizer.zero_grad()\n\n  # backward pass\n  loss.backward()\n\n  # parameters update\n  optimizer.step()\n\n  # print loss in each epoch\n  print(f'Epoch: {epoch + 1}, Loss: {loss.item()}')\n\n# model evaluation\nwith torch.no_grad():\n  y_pred = model.forward(X_test_tensor)\n  y_pred = (y_pred > 0.5).float()\n  accuracy = (y_pred == y_test_tensor).float().mean()\n  print(f'Accuracy: {accuracy.item()}')","code_src":"pytorch_training_pipeline_using_nn_module.ipynb","code_cells":"15, 19, 22, 24, 26","short":"nn pipeline","sub":"BCELoss + SGD"},{"id":"dataloader","title":"Dataset and DataLoader","nb":"Full_pytorch_training_pipeline_using_nn_module.ipynb","concept":"Mini-batch training with a custom Dataset and DataLoader; batch-wise evaluation","apis":["torch.utils.data.Dataset","__len__","__getitem__","DataLoader(batch_size, shuffle)","for xb, yb in loader","model.eval()","torch.no_grad()",".view(-1)"],"what":"The full pipeline with batching. `CustomDataset` tells PyTorch how many samples there are (`__len__`) and how to fetch one (`__getitem__`); `DataLoader` shuffles indices, fetches 32 samples at a time and stacks them into batch tensors. The model now updates 15 times per epoch instead of once.","why":"Real datasets don't fit in memory as one tensor, and full-batch gradient descent takes one step per epoch. Mini-batches give many noisier steps per epoch (often generalising better), bounded memory per step, and a standard interface every later notebook reuses: MNIST, VGG16, RNN and LSTM all plug a Dataset into a DataLoader.","mental":"The Dataset is a library catalogue: it knows how many books there are and how to fetch book number i. The DataLoader is the librarian who shuffles the catalogue and brings you 32 books at a time, stacked into a pile (one tensor). The final pile may be smaller.","syntax":"class CustomDataset(Dataset):\n    def __init__(self, features, labels):\n        self.features, self.labels = features, labels\n    def __len__(self):\n        return self.features.shape[0]\n    def __getitem__(self, index):\n        return self.features[index], self.labels[index]\n\nloader = DataLoader(CustomDataset(X, y), batch_size=32, shuffle=True)\nfor batch_features, batch_labels in loader:\n    ...","lines":[["class CustomDataset(Dataset):","Map-style dataset: anything with __len__ and __getitem__."],["return self.features[index],self.lables[index]","Returns one (x, y) pair. Commit f53e4a6 fixed this line: it used to return self.lables (the whole tensor)."],["train_loader=DataLoader(train_dataset,batch_size=32,shuffle=True)","455 samples / 32 = 15 batches per epoch (the last has 7)."],["test_loader=DataLoader(test_dataset,batch_size=32,shuffle=True)","Shuffling the test set is harmless but pointless; shuffle=False is the convention."],["for batch_features, batch_labels in train_loader:","Each iteration: x is (32,30), y is (32,)."],["loss = loss_function(y_pred, batch_labels.view(-1,1))","(32,1) vs (32,1): shapes match for BCELoss."],["print(f'Epoch: {epoch + 1}, Loss: {loss.item()}')","Prints only the last batch's loss, which is why the curve jumps around (0.17, 0.08, 0.22, 0.32...)."],["model.eval()  # Set the model to evaluation mode","Correct habit, though this model has no Dropout/BatchNorm so it changes nothing yet."],["y_pred = (y_pred > 0.8).float()","Threshold 0.8, not 0.5. Biases predictions toward class 0 (benign)."],["batch_accuracy = (y_pred.view(-1) == batch_labels).float().mean().item()","The .view(-1) fixes the broadcasting bug from the previous notebook."],["overall_accuracy = sum(accuracy_list) / len(accuracy_list)","Averages batch accuracies, so the last 18-sample batch counts as much as a full one. Sum correct / total samples is exact."]],"internals":"DataLoader builds a Sampler (RandomSampler when shuffle=True) that yields indices, a BatchSampler that groups them into lists of 32, and calls `dataset[i]` for each. `default_collate` then stacks the list of (x, y) tuples into one x tensor of shape (32, 30) and one y tensor of shape (32,). With num_workers > 0 the fetching happens in subprocesses. If `__getitem__` returns the whole label tensor instead of one label, collate stacks 3
